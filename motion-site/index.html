<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a0f">
<title>Générateur Motion-Site</title>
<style>
:root{--bg:#0a0a0f;--carte:#141019;--bord:#2a2035;--txt:#EDEDED;--mut:#9A8FA6;--violet:#A855F7;--violet2:#7828be;--vert:#3ED37B;--rouge:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{background:
  radial-gradient(ellipse 700px 500px at 20% 0%, rgba(168,85,247,.16), transparent 60%),
  radial-gradient(ellipse 600px 500px at 90% 20%, rgba(120,40,190,.14), transparent 60%),
  var(--bg);
  color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.45;min-height:100vh;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin-bottom:4px}
h1 b{color:var(--violet)}
.sous{color:var(--mut);font-size:15px;margin-bottom:18px}
.carte{background:var(--carte);border:1px solid var(--bord);border-radius:16px;padding:16px;margin-bottom:14px}
.carte h2{font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--violet);margin-bottom:12px}
.champ{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.champ:last-child{margin-bottom:0}
label{font-size:13px;color:var(--mut);font-weight:600}
label b{color:#d9c7ff}
input[type=text],textarea,select{width:100%;min-height:46px;padding:11px 13px;border-radius:11px;border:1px solid var(--bord);background:#0e0b14;color:var(--txt);font:inherit;font-size:16px}
textarea{min-height:92px;resize:vertical;line-height:1.4}
input:focus,textarea:focus,select:focus{outline:2px solid var(--violet);outline-offset:0;border-color:var(--violet)}
.row{display:flex;gap:10px}.row>*{flex:1}
.seg{display:flex;gap:8px;margin-bottom:12px}
.seg button{flex:1;min-height:44px;border-radius:11px;border:1px solid var(--bord);background:transparent;color:var(--mut);font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.seg button.on{background:var(--violet);border-color:var(--violet);color:#fff}
.hint{font-size:12px;color:var(--mut);margin-top:2px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:12px 20px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--violet),var(--violet2));color:#fff;font:inherit;font-weight:800;font-size:18px;cursor:pointer;width:100%;box-shadow:0 12px 40px rgba(168,85,247,.4)}
.btn:active{transform:scale(.99)}
.btn[disabled]{opacity:.55;cursor:default;box-shadow:none}
.etat{margin-top:14px;text-align:center;font-size:15px;min-height:1.3em}
.etat.err{color:var(--rouge)}.etat.ok{color:var(--vert)}
.resultat{display:none;margin-top:16px}
.resultat.on{display:block}
video{width:100%;border-radius:14px;border:1px solid var(--bord);background:#000;display:block}
.dl{display:inline-flex;margin-top:10px;color:var(--violet);font-weight:700;text-decoration:none}
.masque{display:none}
.spin{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Générateur <b>Motion-Site</b></h1>
  <p class="sous">Remplis, clique, récupère ta vidéo. Fabrication côté serveur — aucun token Claude.</p>

  <!-- AVATAR + HOOK -->
  <div class="carte">
    <h2>Avatar & accroche</h2>
    <div class="champ">
      <label>Avatar (clip de toi)</label>
      <select id="avatar">
        <option value="A1_hook_frontal.mp4">A1 — hook frontal</option>
        <option value="D1_hook_frontal.mp4">D1 — hook frontal</option>
        <option value="B1_principe.mp4">B1 — explication</option>
        <option value="C2_commente_motcle.mp4">C2 — commente</option>
        <option value="C2_frappe_telephone.mp4">C2 — tape sur tel</option>
        <option value="D2_insistance_doigts.mp4">D2 — insistance</option>
        <option value="D3_cta_lunettes.mp4">D3 — CTA lunettes</option>
        <option value="D4_relance_barbe.mp4">D4 — relance</option>
        <option value="E2_confidence.mp4">E2 — confidence</option>
        <option value="E3_neutre.mp4">E3 — neutre</option>
      </select>
    </div>
    <div class="champ">
      <label><b>Hook</b> — le gros texte derrière l'avatar</label>
      <input type="text" id="hook" maxlength="24" placeholder="ex. MON SITE" value="MON SITE">
    </div>
  </div>

  <!-- ÉCRAN -->
  <div class="carte">
    <h2>Écran présenté</h2>
    <div class="champ">
      <label>Adresse (barre du navigateur)</label>
      <input type="text" id="url" maxlength="40" placeholder="monsite.fr" value="monsite.fr">
    </div>
    <div class="champ">
      <label>Sur-titre</label>
      <input type="text" id="eyebrow" maxlength="40" placeholder="Ton business en ligne" value="Ton business en ligne">
    </div>
    <div class="row">
      <div class="champ"><label>Titre</label><input type="text" id="titre" maxlength="40" placeholder="Ton site qui convertit" value="Ton site qui convertit"></div>
      <div class="champ"><label>Mot en violet</label><input type="text" id="titre_hl" maxlength="20" placeholder="convertit" value="convertit"></div>
    </div>
    <div class="champ">
      <label>Sous-titre du site</label>
      <input type="text" id="sous_titre" maxlength="90" placeholder="Une vitrine claire, rapide…" value="Une vitrine claire, rapide et pensée pour convertir.">
    </div>
    <div class="champ">
      <label>Bouton (CTA)</label>
      <input type="text" id="cta" maxlength="30" placeholder="Réserver un appel" value="Réserver un appel">
    </div>
  </div>

  <!-- VOIX -->
  <div class="carte">
    <h2>Voix</h2>
    <div class="seg" id="seg-voix">
      <button data-v="cloner" class="on">Voix clonée (texte)</button>
      <button data-v="fichier">Mon fichier audio</button>
      <button data-v="aucune">Aucune</button>
    </div>
    <div class="champ" id="bloc-script">
      <label><b>Script</b> — ce que la voix va dire</label>
      <textarea id="script" placeholder="Écris ici le texte que l'avatar doit dire…"></textarea>
      <span class="hint">La durée de la vidéo suit la longueur du script.</span>
    </div>
    <div class="champ masque" id="bloc-audio">
      <label>Fichier audio (mp3 / wav)</label>
      <input type="file" id="audio" accept="audio/*">
    </div>
  </div>

  <!-- SOUS-TITRES -->
  <div class="carte">
    <h2>Sous-titres</h2>
    <div class="champ">
      <label>Une phrase par ligne (réparties dans le temps)</label>
      <textarea id="subs" placeholder="mon site que j'ai vibe&#10;en une soirée&#10;et il convertit déjà">mon site que j'ai vibe
en une soirée
et il convertit déjà</textarea>
    </div>
  </div>

  <button class="btn" id="go">🎬 Générer la vidéo</button>
  <div class="etat" id="etat"></div>

  <div class="resultat" id="resultat">
    <video id="video" controls playsinline></video>
    <a class="dl" id="dl" download>⬇ Télécharger la vidéo</a>
  </div>
</div>

<script>
(function(){
  'use strict';
  // Webhook n8n qui lance generer.mjs côté serveur (à créer côté n8n).
  var API = 'https://n7n.automatisationboost.com/webhook/generer-motion-site';
  var $ = function(id){return document.getElementById(id);};
  var voix = 'cloner';

  // segmented control voix
  $('seg-voix').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    voix = b.dataset.v;
    Array.prototype.forEach.call(this.children, function(x){x.classList.toggle('on', x===b);});
    $('bloc-script').classList.toggle('masque', voix!=='cloner');
    $('bloc-audio').classList.toggle('masque', voix!=='fichier');
  });

  function fileToDataURL(f){
    return new Promise(function(res,rej){
      var r = new FileReader(); r.onload=function(){res(r.result);}; r.onerror=rej; r.readAsDataURL(f);
    });
  }

  async function payload(){
    var subs = $('subs').value.split('\n').map(function(s){return s.trim();}).filter(Boolean);
    var p = {
      avatar: $('avatar').value,
      hook: $('hook').value.trim(),
      ecran: {
        url: $('url').value.trim(),
        eyebrow: $('eyebrow').value.trim(),
        titre: $('titre').value.trim(),
        titre_surligne: $('titre_hl').value.trim(),
        sous_titre: $('sous_titre').value.trim(),
        cta: $('cta').value.trim()
      },
      voix: voix,
      script: voix==='cloner' ? $('script').value.trim() : '',
      sous_titres: subs
    };
    if(voix==='fichier'){
      var f = $('audio').files[0];
      if(!f) throw new Error('Choisis un fichier audio.');
      p.audio_data = await fileToDataURL(f);
      p.audio_nom = f.name;
    }
    if(voix==='cloner' && !p.script) throw new Error('Écris le script (ce que la voix doit dire).');
    return p;
  }

  var go = $('go'), etat = $('etat');
  go.addEventListener('click', async function(){
    etat.className='etat'; etat.textContent='';
    $('resultat').classList.remove('on');
    var p;
    try{ p = await payload(); }catch(e){ etat.className='etat err'; etat.textContent=e.message; return; }
    go.disabled=true; go.innerHTML='<span class="spin"></span> Fabrication en cours…';
    etat.textContent='Ça prend 1 à 3 minutes selon la longueur.';
    try{
      // Le webhook répond VITE avec jobId + l'URL R2 prévue (génération async côté serveur).
      var r = await fetch(API, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});
      if(!r.ok) throw new Error('Serveur : HTTP '+r.status);
      var j = await r.json();
      var url = j.videoUrl || j.url || j.video;
      if(!url) throw new Error(j.message || 'Réponse sans vidéo.');
      // On attend que la vidéo apparaisse sur R2 (poll HEAD, anti-cache).
      etat.textContent='Fabrication en cours… la vidéo apparaît dès qu\'elle est prête.';
      var ready=false, tries=0;
      while(!ready && tries<100){ // ~8 min max
        await new Promise(function(res){setTimeout(res,5000);});
        tries++;
        try{ var h = await fetch(url+'?t='+Date.now(), {method:'HEAD',cache:'no-store'}); if(h.ok){ ready=true; } }catch(e){}
      }
      if(!ready) throw new Error('La vidéo met trop de temps — réessaie dans un instant.');
      $('video').src = url; $('dl').href = url;
      $('resultat').classList.add('on');
      etat.className='etat ok'; etat.textContent='✓ Vidéo prête.';
    }catch(e){
      etat.className='etat err';
      etat.textContent='Échec : '+e.message+' (le webhook n8n n\'est peut-être pas encore branché).';
    }finally{
      go.disabled=false; go.innerHTML='🎬 Générer la vidéo';
    }
  });
})();
</script>
</body>
</html>
