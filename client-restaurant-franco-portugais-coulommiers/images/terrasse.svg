<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87b5d4"/>
      <stop offset="100%" stop-color="#c8dde8"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="1440" height="340" fill="url(#sky)"/>
  <!-- Ground / terrace floor -->
  <rect y="340" width="1440" height="160" fill="#c4a87a"/>
  <!-- Pavement pattern -->
  <line x1="0" y1="360" x2="1440" y2="360" stroke="#b89a6a" stroke-width="1" opacity=".5"/>
  <line x1="0" y1="390" x2="1440" y2="390" stroke="#b89a6a" stroke-width="1" opacity=".5"/>
  <line x1="0" y1="420" x2="1440" y2="420" stroke="#b89a6a" stroke-width="1" opacity=".5"/>
  <!-- Trees -->
  <circle cx="200" cy="220" r="80" fill="#5a8c4a" opacity=".8"/>
  <rect x="192" y="300" width="16" height="80" fill="#7a5c3a"/>
  <circle cx="1240" cy="200" r="100" fill="#4d7a40" opacity=".8"/>
  <rect x="1232" y="300" width="16" height="80" fill="#7a5c3a"/>
  <!-- Tables ext -->
  <ellipse cx="520" cy="390" rx="80" ry="22" fill="#8b6f47" opacity=".8"/>
  <ellipse cx="720" cy="395" rx="80" ry="22" fill="#8b6f47" opacity=".8"/>
  <ellipse cx="920" cy="390" rx="80" ry="22" fill="#8b6f47" opacity=".8"/>
  <!-- Sun -->
  <circle cx="1100" cy="90" r="50" fill="#f5d040" opacity=".6"/>
  <!-- Caption -->
  <text x="720" y="472" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#7a6040" opacity=".6" font-style="italic">Terrasse — photo à remplacer</text>
</svg>
