<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87b5d4"/>
      <stop offset="100%" stop-color="#c8dde8"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="340" fill="url(#sky)"/>
  <rect y="340" width="1440" height="160" fill="#c4a87a"/>
  <!-- Note : le vrai titre "La terrasse" et son texte sont déjà posés en
       HTML par-dessus (terrace-strip__content) — cette image ne doit pas
       porter de texte large qui ferait doublon ou se ferait rogner au
       recadrage. Étiquette interne minimale, centrée, hors de la zone où
       le titre HTML est affiché. -->
  <line x1="675" y1="410" x2="700" y2="410" stroke="#6b5540" stroke-width="1" opacity=".5"/>
  <line x1="740" y1="410" x2="765" y2="410" stroke="#6b5540" stroke-width="1" opacity=".5"/>
  <text x="720" y="415" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#6b5540" letter-spacing="1.5" opacity=".7">PHOTO À VENIR</text>
</svg>
