<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <rect width="800" height="1000" fill="#e8e4de"/>
  <!-- Wall -->
  <rect width="800" height="700" fill="#d9d3cb"/>
  <!-- Floor -->
  <rect y="700" width="800" height="300" fill="#c9b89a"/>
  <!-- Window -->
  <rect x="260" y="80" width="280" height="360" fill="#b8d4e8" opacity=".6"/>
  <rect x="260" y="80" width="280" height="360" fill="none" stroke="#a09080" stroke-width="8"/>
  <line x1="400" y1="80" x2="400" y2="440" stroke="#a09080" stroke-width="4"/>
  <line x1="260" y1="260" x2="540" y2="260" stroke="#a09080" stroke-width="4"/>
  <!-- Tables -->
  <ellipse cx="200" cy="760" rx="120" ry="40" fill="#8b6f47" opacity=".7"/>
  <ellipse cx="600" cy="760" rx="120" ry="40" fill="#8b6f47" opacity=".7"/>
  <!-- Chairs suggestion -->
  <rect x="120" y="720" width="40" height="80" rx="4" fill="#6b5540" opacity=".5"/>
  <rect x="240" y="720" width="40" height="80" rx="4" fill="#6b5540" opacity=".5"/>
  <!-- Caption -->
  <text x="400" y="960" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#a09080" font-style="italic">Intérieur du restaurant — photo à remplacer</text>
</svg>
