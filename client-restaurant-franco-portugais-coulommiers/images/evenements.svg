<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <rect width="800" height="1000" fill="#1e1812"/>
  <!-- Festive lights -->
  <circle cx="100" cy="100" r="8" fill="#f5c842" opacity=".7"/>
  <circle cx="220" cy="80" r="6" fill="#f5c842" opacity=".6"/>
  <circle cx="340" cy="110" r="9" fill="#f5c842" opacity=".8"/>
  <circle cx="460" cy="75" r="7" fill="#f5c842" opacity=".65"/>
  <circle cx="580" cy="100" r="8" fill="#f5c842" opacity=".7"/>
  <circle cx="700" cy="85" r="6" fill="#f5c842" opacity=".6"/>
  <!-- String lines -->
  <polyline points="100,100 220,80 340,110 460,75 580,100 700,85" fill="none" stroke="#f5c842" stroke-width="1.5" opacity=".3"/>
  <!-- Tables dressed -->
  <ellipse cx="400" cy="600" rx="200" ry="55" fill="#2d2010" opacity=".9"/>
  <rect x="200" y="500" width="400" height="100" rx="6" fill="#2d2010" opacity=".7"/>
  <!-- Glasses -->
  <ellipse cx="320" cy="530" rx="15" ry="6" fill="#d4a870" opacity=".4"/>
  <ellipse cx="400" cy="525" rx="15" ry="6" fill="#d4a870" opacity=".4"/>
  <ellipse cx="480" cy="530" rx="15" ry="6" fill="#d4a870" opacity=".4"/>
  <!-- Candles glow -->
  <circle cx="400" cy="480" r="50" fill="#f5c842" opacity=".05"/>
  <circle cx="400" cy="490" r="7" fill="#f5c842" opacity=".5"/>
  <!-- Text -->
  <text x="400" y="800" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#d4a870" opacity=".7" font-style="italic">Soirée événement — photo à remplacer</text>
</svg>
