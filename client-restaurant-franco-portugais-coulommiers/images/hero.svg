<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d2319"/>
      <stop offset="100%" stop-color="#4a3826"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <!-- Table suggestion -->
  <ellipse cx="720" cy="600" rx="280" ry="60" fill="#3d2e1e" opacity=".8"/>
  <rect x="560" y="400" width="320" height="200" rx="4" fill="#3d2e1e" opacity=".6"/>
  <!-- Plates -->
  <circle cx="650" cy="540" r="60" fill="#f3f0eb" opacity=".15"/>
  <circle cx="790" cy="540" r="60" fill="#f3f0eb" opacity=".15"/>
  <!-- Wine glass -->
  <ellipse cx="720" cy="470" rx="18" ry="8" fill="#d4a870" opacity=".3"/>
  <rect x="716" y="470" width="8" height="60" fill="#d4a870" opacity=".2"/>
  <!-- Candle light -->
  <circle cx="720" cy="420" r="40" fill="#f5c842" opacity=".08"/>
  <circle cx="720" cy="435" r="6" fill="#f5c842" opacity=".4"/>
  <!-- Note interne : petite étiquette centrée, largeur contenue pour
       rester lisible même très recadrée par object-fit:cover en portrait
       mobile (contrairement à l'ancien "Le Saint-Pierre" en 72px qui
       débordait et se faisait rogner des deux côtés à 390px). Placée bas
       de cadre (y=800) car l'objet-fit:cover ne rogne pas la hauteur ici :
       le centre vertical est occupé par le vrai titre HTML par-dessus. -->
  <line x1="675" y1="800" x2="705" y2="800" stroke="#d4a870" stroke-width="1" opacity=".45"/>
  <line x1="735" y1="800" x2="765" y2="800" stroke="#d4a870" stroke-width="1" opacity=".45"/>
  <text x="720" y="805" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#d4a870" opacity=".45" letter-spacing="2">PHOTO À VENIR</text>
</svg>
