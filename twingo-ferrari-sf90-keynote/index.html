<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prévisualisation — Twingo Ferrari SF90</title>
<style>
  :root{--bg:#090a0d;--panel:#12151a;--line:#29303a;--yellow:#f5d90a;--muted:#a6acb6;--text:#f5f7fa}
  *{box-sizing:border-box}
  body{margin:0;padding:2rem 1rem 4rem;background:radial-gradient(circle at 50% 0,#1b1b13 0,#090a0d 42rem);color:var(--text);font-family:Inter,system-ui,sans-serif}
  .wrap{max-width:500px;margin:auto}
  .back{display:inline-block;margin-bottom:1rem;color:var(--muted);font-size:.8rem;text-decoration:none}
  header{text-align:center;margin-bottom:1.5rem}
  h1{margin:0 0 .35rem;font-size:1.4rem;color:var(--yellow)}
  header p{margin:0;color:var(--muted);font-size:.85rem}
  .card{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:0 24px 70px #0008}
  .head{display:flex;justify-content:space-between;gap:1rem;align-items:center;padding:1rem 1.2rem;border-bottom:1px solid var(--line)}
  .head strong{font-size:.95rem}.badge{padding:.25rem .6rem;border:1px solid #f5d90a66;border-radius:999px;color:var(--yellow);font-size:.7rem;white-space:nowrap}
  video{display:block;width:100%;background:#000;aspect-ratio:16/9}
  .meta{padding:1rem 1.2rem;color:#d4d7dc;font-size:.82rem;line-height:1.7}.meta b{color:var(--yellow)}
  .refs{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;padding:0 1.2rem 1.2rem}.refs img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
  .refs small{display:block;margin-top:.35rem;color:var(--muted);font-size:.7rem}
</style>
</head>
<body>
<main class="wrap">
  <a class="back" href="/">← Toutes les vidéos</a>
  <header><h1>Twingo Ferrari SF90</h1><p>Reel automobile généré avec Higgsfield + Seedance 2.5</p></header>
  <section class="card">
    <div class="head"><strong>Rendu keynote · 30 s</strong><span class="badge">À valider</span></div>
    <video src="https://assets.automatisationboost.com/previsualisation/twingo-ferrari-sf90-keynote/video.mp4" controls playsinline preload="metadata"></video>
    <div class="meta">Showroom sombre → révélation → ignition → conduite golden-hour → flyby.<br><b>Audio :</b> moteur, vent et route, sans musique.</div>
    <div class="refs">
      <div><img src="assets/twingo-ferrari-sf90-reference.png" alt="Référence voiture Twingo inspirée Ferrari SF90"><small>Référence voiture</small></div>
      <div><img src="assets/avatar-reference.png" alt="Référence avatar Tony"><small>Référence avatar</small></div>
    </div>
  </section>
</main>
</body>
</html>
