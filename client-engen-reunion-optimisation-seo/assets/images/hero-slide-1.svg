<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#001850;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0040c8;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="road1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a"/>
      <stop offset="100%" style="stop-color:#111"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="1400" height="520" fill="url(#sky1)"/>
  <!-- Stars -->
  <circle cx="200" cy="60" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="450" cy="40" r="1" fill="white" opacity="0.5"/>
  <circle cx="700" cy="80" r="2" fill="white" opacity="0.4"/>
  <circle cx="1100" cy="50" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="1250" cy="90" r="1" fill="white" opacity="0.3"/>
  <!-- Ground -->
  <rect y="380" width="1400" height="140" fill="#1a1a1a"/>
  <!-- Road -->
  <rect y="400" width="1400" height="120" fill="url(#road1)"/>
  <!-- Road markings -->
  <rect x="0" y="455" width="180" height="8" rx="4" fill="#f5a800" opacity="0.8"/>
  <rect x="220" y="455" width="180" height="8" rx="4" fill="#f5a800" opacity="0.8"/>
  <rect x="440" y="455" width="180" height="8" rx="4" fill="#f5a800" opacity="0.8"/>
  <rect x="660" y="455" width="180" height="8" rx="4" fill="#f5a800" opacity="0.8"/>
  <rect x="880" y="455" width="180" height="8" rx="4" fill="#f5a800" opacity="0.8"/>
  <rect x="1100" y="455" width="180" height="8" rx="4" fill="#f5a800" opacity="0.8"/>
  <!-- Gas station silhouette -->
  <rect x="800" y="240" width="300" height="160" rx="4" fill="#001850" opacity="0.8"/>
  <rect x="780" y="200" width="340" height="50" rx="4" fill="#002b8f"/>
  <rect x="820" y="200" width="260" height="10" rx="2" fill="#f5a800"/>
  <!-- Pumps -->
  <rect x="870" y="300" width="40" height="100" rx="6" fill="#0040c8"/>
  <rect x="880" y="290" width="20" height="20" rx="3" fill="#f5a800"/>
  <rect x="980" y="300" width="40" height="100" rx="6" fill="#0040c8"/>
  <rect x="990" y="290" width="20" height="20" rx="3" fill="#f5a800"/>
  <!-- Canopy columns -->
  <rect x="820" y="250" width="20" height="150" fill="#001850"/>
  <rect x="1060" y="250" width="20" height="150" fill="#001850"/>
  <!-- ENGEN sign on station -->
  <rect x="850" y="215" width="200" height="26" rx="3" fill="#f5a800"/>
  <text x="950" y="233" font-family="Arial" font-size="16" font-weight="900" fill="#002b8f" text-anchor="middle" letter-spacing="3">ENGEN</text>
  <!-- Mountains/hills in background -->
  <ellipse cx="300" cy="380" rx="280" ry="120" fill="#001040" opacity="0.7"/>
  <ellipse cx="1150" cy="380" rx="250" ry="110" fill="#001040" opacity="0.6"/>
  <!-- Light glow from station -->
  <ellipse cx="950" cy="400" rx="200" ry="30" fill="#f5a800" opacity="0.08"/>
  <!-- Reflection on road -->
  <rect x="880" y="420" width="10" height="60" rx="2" fill="#f5a800" opacity="0.2"/>
  <rect x="990" y="420" width="10" height="60" rx="2" fill="#f5a800" opacity="0.2"/>
</svg>