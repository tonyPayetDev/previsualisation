<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#002b8f"/>
      <stop offset="50%" style="stop-color:#001565"/>
      <stop offset="100%" style="stop-color:#0d47a1"/>
    </linearGradient>
    <radialGradient id="glow2" cx="60%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f5a800;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#f5a800;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1400" height="520" fill="url(#bg2)"/>
  <rect width="1400" height="520" fill="url(#glow2)"/>
