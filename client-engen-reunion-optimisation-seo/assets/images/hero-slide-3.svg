<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="tropical" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#001850"/>
      <stop offset="60%" style="stop-color:#002b8f"/>
      <stop offset="100%" style="stop-color:#003ba0"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="520" fill="url(#tropical)"/>
  <!-- Ocean -->
  <ellipse cx="700" cy="520" rx="900" ry="150" fill="#001040" opacity="0.5"/>
  <rect y="420" width="1400" height="100" fill="#001040" opacity="0.4"/>
  <!-- Sun/horizon glow -->
  <ellipse cx="700" cy="420" rx="400" ry="60" fill="#f5a800" opacity="0.12"/>
  <ellipse cx="700" cy="420" rx="200" ry="30" fill="#f5a800" opacity="0.1"/>
  <!-- Mountain (La Réunion silhouette) -->
  <path d="M0 520 L0 320 L150 200 L280 240 L400 150 L550 280 L650 200 L750 260 L900 180 L1050 250 L1150 220 L1280 300 L1400 260 L1400 520 Z" fill="#001040" opacity="0.8"/>
  <path d="M0 520 L0 360 L200 280 L350 310 L500 250 L650 280 L800 240 L1000 270 L1200 260 L1400 290 L1400 520 Z" fill="#001565" opacity="0.6"/>
  <!-- Palm trees -->
  <line x1="150" y1="520" x2="160" y2="340" stroke="#0d1f40" stroke-width="12" stroke-linecap="round"/>
  <ellipse cx="160" cy="310" rx="60" ry="25" fill="#0d400d" opacity="0.7" transform="rotate(-20, 160, 310)"/>
  <ellipse cx="140" cy="320" rx="55" ry="20" fill="#0d400d" opacity="0.6" transform="rotate(15, 140, 320)"/>
  <ellipse cx="180" cy="320" rx="50" ry="18" fill="#0d400d" opacity="0.6" transform="rotate(-5, 180, 320)"/>
  <!-- Second palm -->
  <line x1="1250" y1="520" x2="1240" y2="350" stroke="#0d1f40" stroke-width="12" stroke-linecap="round"/>
  <ellipse cx="1240" cy="322" rx="60" ry="25" fill="#0d400d" opacity="0.7" transform="rotate(20, 1240, 322)"/>
  <ellipse cx="1260" cy="330" rx="55" ry="20" fill="#0d400d" opacity="0.6" transform="rotate(-15, 1260, 330)"/>
  <!-- Water reflections -->
  <line x1="550" y1="450" x2="850" y2="450" stroke="#f5a800" stroke-width="1.5" opacity="0.1"/>
  <line x1="600" y1="465" x2="800" y2="465" stroke="#f5a800" stroke-width="1" opacity="0.07"/>
  <!-- Engen station on road -->
  <rect x="580" y="360" width="240" height="80" rx="6" fill="#002b8f" opacity="0.95"/>
  <rect x="570" y="340" width="260" height="28" rx="4" fill="#001850" opacity="0.95"/>
  <rect x="590" y="342" width="220" height="6" rx="2" fill="#f5a800"/>
  <!-- ENGEN on station -->
  <text x="700" y="358" font-family="Arial" font-size="14" font-weight="900" fill="white" text-anchor="middle" letter-spacing="4">ENGEN RÉUNION</text>
  <!-- Pumps small -->
  <rect x="620" y="375" width="28" height="60" rx="4" fill="#0040c8"/>
  <rect x="752" y="375" width="28" height="60" rx="4" fill="#0040c8"/>
  <!-- Stars in sky -->
  <circle cx="300" cy="80" r="2" fill="white" opacity="0.7"/>
  <circle cx="600" cy="50" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="900" cy="90" r="2" fill="white" opacity="0.6"/>
  <circle cx="1100" cy="60" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="450" cy="120" r="1" fill="white" opacity="0.5"/>
</svg>