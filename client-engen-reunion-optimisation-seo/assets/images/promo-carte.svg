<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220">
  <defs>
    <linearGradient id="pc1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5a800"/>
      <stop offset="100%" style="stop-color:#d4900a"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#002b8f"/>
      <stop offset="100%" style="stop-color:#001565"/>
    </linearGradient>
  </defs>
  <rect width="400" height="220" fill="url(#pc1)"/>
  <!-- Card illustration -->
  <rect x="40" y="50" width="200" height="120" rx="12" fill="url(#card1)" transform="rotate(-8, 140, 110)"/>
  <rect x="50" y="57" width="200" height="120" rx="12" fill="url(#card1)" opacity="0.9" transform="rotate(-3, 150, 117)"/>
  <rect x="60" y="64" width="200" height="120" rx="12" fill="url(#card1)"/>
  <!-- Card details -->
  <rect x="80" y="95" width="30" height="22" rx="3" fill="#f5a800"/>
  <text x="165" y="135" font-family="Arial" font-size="9" fill="rgba(255,255,255,0.8)" text-anchor="middle">ENGEN ONE CARD</text>
  <text x="165" y="160" font-family="Arial" font-size="9" fill="rgba(255,255,255,0.5)">•••• •••• •••• 4287</text>
  <!-- Right side text -->
  <text x="305" y="90" font-family="Arial" font-size="13" fill="#002b8f" text-anchor="middle" font-weight="700">Ma carte</text>
  <text x="305" y="108" font-family="Arial" font-size="20" font-weight="900" fill="#002b8f" text-anchor="middle">Fidélité</text>
  <text x="305" y="130" font-family="Arial" font-size="12" fill="#002b8f" text-anchor="middle">+2 pts</text>
  <text x="305" y="148" font-family="Arial" font-size="10" fill="#003ba0" text-anchor="middle">/litre acheté</text>
</svg>