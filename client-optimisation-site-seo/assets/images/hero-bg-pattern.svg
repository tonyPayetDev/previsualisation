<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- SEO Analysis visual -->
  <rect width="800" height="600" fill="#003d87"/>
  <!-- Grid lines -->
  <g opacity="0.06" stroke="white" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="700" y1="0" x2="700" y2="600"/>
  </g>
  <!-- Trend line -->
  <path d="M100 420 L200 370 L300 340 L400 280 L500 230 L600 160 L700 100" stroke="#ffcc00" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M100 420 L200 370 L300 340 L400 280 L500 230 L600 160 L700 100 L700 450 L100 450 Z" fill="#ffcc00" fill-opacity="0.08"/>
  <!-- Data points -->
  <circle cx="100" cy="420" r="6" fill="#ffcc00"/>
  <circle cx="200" cy="370" r="6" fill="#ffcc00"/>
  <circle cx="300" cy="340" r="6" fill="#ffcc00"/>
  <circle cx="400" cy="280" r="6" fill="#ffcc00"/>
  <circle cx="500" cy="230" r="6" fill="#ffcc00"/>
  <circle cx="600" cy="160" r="6" fill="#ffcc00"/>
  <circle cx="700" cy="100" r="8" fill="#ffcc00" stroke="white" stroke-width="2"/>
</svg>
