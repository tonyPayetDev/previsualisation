<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Mode appel</title>
<style>
  :root{--fond:#07080c;--carte:#101420;--ligne:#1e2637;--blanc:#f0f3f8;--gris:#8590a3;
        --vert:#34d399;--jaune:#FFE600;--rouge:#fb7185;--bleu:#60a5fa}
  *{margin:0;padding:0;box-sizing:border-box}
  html{height:100%;background:var(--fond)}
  body{height:100%;max-width:560px;margin:0 auto;width:100%}
  body{background:var(--fond);color:var(--blanc);
    font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;flex-direction:column;padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
  header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
  .prog{flex:1;height:5px;background:#161d2b;border-radius:999px;overflow:hidden}
  .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--jaune),#A855F7);width:0;transition:width .35s}
  .cpt{font-size:12.5px;color:var(--gris);white-space:nowrap;font-variant-numeric:tabular-nums}
  a.retour{color:var(--gris);text-decoration:none;font-size:12.5px}
  main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;min-height:0;overflow-y:auto}
  .badge{display:inline-block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;
    border:1px solid var(--ligne);border-radius:999px;padding:4px 11px;color:var(--gris);align-self:flex-start}
  .badge.echauffement{color:var(--bleu);border-color:#26405f}
  .badge.rappel{color:var(--jaune);border-color:#4a4310}
  h1{font-size:clamp(28px,7.5vw,42px);line-height:1.06;letter-spacing:-.025em}
  .meta{color:var(--gris);font-size:14px}
  .vu{background:var(--carte);border:1px solid var(--ligne);border-left:2px solid var(--bleu);
      border-radius:9px;padding:11px 13px;font-size:14px;color:#c2cbd9}
  .dire{background:#0d1626;border:1px solid #22354f;border-radius:12px;padding:16px 17px}
  .dire .t{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gris);margin-bottom:8px}
  .dire p{font-size:clamp(17px,4.6vw,21px);line-height:1.42}
  details{background:var(--carte);border:1px solid var(--ligne);border-radius:9px;padding:11px 13px}
  details summary{cursor:pointer;font-size:13.5px;color:var(--gris);list-style:none}
  details summary::-webkit-details-marker{display:none}
  details p{font-size:14.5px;margin-top:9px;color:#cbd3e0}
  details p b{display:block;color:var(--gris);font-size:11.5px;letter-spacing:.14em;
    text-transform:uppercase;margin-bottom:2px;font-weight:600}
  .tel{display:block;text-align:center;background:#10281c;border:1px solid #1f6f52;color:#8ff0c4;
    border-radius:13px;padding:19px;font-size:23px;font-weight:700;text-decoration:none;
    letter-spacing:.02em;font-variant-numeric:tabular-nums}
  .tel small{display:block;font-size:12px;font-weight:400;color:#5fae8c;letter-spacing:.1em;
    text-transform:uppercase;margin-bottom:3px}
  footer{display:flex;flex-direction:column;gap:9px;padding-top:13px}
  .rang{display:flex;gap:9px}
  button{flex:1;font:inherit;font-size:15px;font-weight:600;border:1px solid var(--ligne);
    background:#141a26;color:var(--blanc);border-radius:11px;padding:15px 10px;cursor:pointer;min-height:54px}
  button:active{transform:translateY(1px)}
  button.parle{border-color:#1f6f52;background:#12271e;color:#8ff0c4}
  .fini{text-align:center;padding:40px 10px}
  .fini h2{font-size:26px;margin-bottom:10px}
  .fini p{color:var(--gris)}
  .note{color:var(--gris);font-size:12.5px;text-align:center}

.wa{display:flex;gap:8px;margin-top:9px}
.wa a.wa-envoi{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  background:#0e2a1c;border:1px solid #1f7a4c;color:#7bebb0;border-radius:11px;
  min-height:50px;padding:0 14px;font-size:15px;font-weight:600;text-decoration:none}
.wa a.wa-envoi .wa-ico{font-size:17px;line-height:1}
.wa.gros a.wa-envoi{background:#128C4A;border-color:#128C4A;color:#fff;min-height:58px;font-size:16.5px}
.wa button.wa-copie{flex:0 0 auto;min-height:50px;padding:0 16px;border-radius:11px;
  background:#141a26;border:1px solid #1e2637;color:#c2cbd9;font:600 14px/1 inherit;cursor:pointer}
.wa button.wa-copie.ok{border-color:#1f7a4c;color:#7bebb0}
.wa-texte{width:100%;margin-top:8px;min-height:96px;font:400 13px/1.5 inherit;
  background:#0b0f16;border:1px solid #1e2637;border-radius:9px;color:#c2cbd9;padding:10px}
.rate{background:#141a26;border:1px solid #1e2637;border-radius:12px;padding:15px;
  display:flex;flex-direction:column;gap:5px}
.rate .t{font-size:15.5px;font-weight:600}
.rate .d{font-size:13.3px;color:#8590a3;line-height:1.5}
.passer{background:none;border:0;color:#8590a3;font:inherit;font-size:14px;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:12px;min-height:44px}

.note-zone{display:flex;flex-direction:column;gap:9px;margin-top:11px}
.note-haut{display:flex;gap:8px;align-items:stretch}
.micro{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;
  background:#1b1430;border:1px solid #4b3a7a;color:#c9b6ff;border-radius:11px;
  min-height:52px;font:600 15px/1 inherit;cursor:pointer;padding:0 14px}
.micro.actif{background:#3a1220;border-color:#8a2440;color:#ffb3c4}
.micro .pastille{width:10px;height:10px;border-radius:50%;background:currentColor;flex:0 0 auto}
.micro.actif .pastille{animation:bat 1s ease-in-out infinite}
@keyframes bat{50%{opacity:.25;transform:scale(.7)}}
.note-txt{width:100%;min-height:74px;font:inherit;font-size:15px;line-height:1.5;
  color:var(--blanc);background:#0b0f16;border:1px solid var(--ligne);
  border-radius:10px;padding:11px 12px;resize:vertical}
.note-txt:focus{outline:0;border-color:#4b3a7a}
.note-aide{font-size:12.5px;color:var(--gris);line-height:1.5}

.rang.trois{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.rang.trois .surplace{grid-column:1/-1;border-color:#4a3d10;background:#1d1706;color:#e8c98a}
</style></head>
<body>
<header>
  <a class="retour" href="../">‹ feuille</a>
  <div class="prog"><i id="barre"></i></div>
  <div class="cpt" id="cpt"></div>
</header>
<main id="ecran"></main>
<footer id="pied"></footer>
<script>
(() => {
  const URL_ETAT='https://n7n.automatisationboost.com/webhook/appels-journal';
  let LEADS=[], etat={}, i=0, duNeuf=false, enVol=false;

  /* Seuls les mobiles réunionnais reçoivent WhatsApp. Un 0262 est un fixe :
     proposer WhatsApp dessus donne un lien mort et fait perdre confiance. */
  const mobile = (t) => {
    const n = String(t || '').replace(/[^0-9+]/g, '')
      .replace(/^\+262/, '0').replace(/^00262/, '0').replace(/^262(?=6)/, '0');
    return /^06(92|93)\d{6}$/.test(n) ? '262' + n.slice(1) : null;
  };
  const premierMobile = (l) => {
    const bruts = String(l.direct || l.tel || '').split(';');
    for (const b of bruts) { const m = mobile(b); if (m) return m; }
    return null;
  };

  /* Le message reprend ce que la fiche dit d'eux. Jamais la note interne de
     Tony (champ « suite ») : elle n'est pas faite pour être lue par eux. */
  const messageWa = (l) => {
    const nom = l.nom;
    const vu = String(l.vitrine || (l.site ? 'site en ligne' : 'aucun site trouvé'));
    const dejaParle = l.cat === 'rappel';
    if (dejaParle) {
      return 'Bonjour, Tony PAYET. On s’est parlé au téléphone au sujet de ' + nom + '. '
        + 'Je n’arrive pas à vous rejoindre — est-ce plus simple pour vous par ici ?';
    }
    if (/ne répond plus|aucun site/i.test(vu)) {
      return 'Bonjour, Tony PAYET, je suis basé à La Réunion. J’ai cherché ' + nom
        + ' sur internet et je n’ai pas trouvé de site qui fonctionne. '
        + 'Je fais des sites et des vidéos courtes pour les établissements d’ici. '
        + 'Est-ce que c’est un sujet pour vous en ce moment ?';
    }
    if (/facebook/i.test(vu)) {
      return 'Bonjour, Tony PAYET, je suis basé à La Réunion. J’ai vu que ' + nom
        + ' n’est présent que sur Facebook. Je fais des sites et des vidéos courtes '
        + 'pour les établissements d’ici. Est-ce que c’est un sujet pour vous ?';
    }
    return 'Bonjour, Tony PAYET, je suis basé à La Réunion. J’ai regardé le site de '
      + nom + ' avant de vous écrire. Je fais des vidéos courtes à partir des photos '
      + 'des établissements, celles qui tournent sur Instagram. Est-ce que je vous montre un exemple ?';
  };

  const blocWa = (l, gros) => {
    const num = premierMobile(l);
    /* Pas de WhatsApp sur un echauffement : la page dit elle-meme que le but
       y est d entendre sa voix, pas de vendre. */
    if (!num || l.cat === 'echauffement') return '';
    const msg = messageWa(l);
    const lien = 'https://wa.me/' + num + '?text=' + encodeURIComponent(msg);
    return '<div class="wa' + (gros ? ' gros' : '') + '">'
      + '<a class="wa-envoi" href="' + lien + '" target="_blank" rel="noopener">'
      + (gros ? 'Envoyer sur WhatsApp' : 'WhatsApp') + '</a>'
      + '<button type="button" class="wa-copie" data-msg="' + msg.replace(/"/g, '&quot;') + '">Copier</button>'
      + '</div>';
  };

  /* Le presse-papier est refusé hors contexte sécurisé : on montre le texte
     au lieu d'échouer sans rien dire. */
  const brancherCopie = (racine) => {
    racine.querySelectorAll('.wa-copie').forEach((b) => {
      b.onclick = async () => {
        const t = b.dataset.msg;
        try {
          await navigator.clipboard.writeText(t);
          b.textContent = 'Copié'; b.classList.add('ok');
          setTimeout(() => { b.textContent = 'Copier'; b.classList.remove('ok'); }, 1600);
        } catch (e) {
          const z = document.createElement('textarea');
          z.className = 'wa-texte'; z.value = t; z.readOnly = true;
          b.parentNode.appendChild(z); z.select(); b.textContent = 'Sélectionne';
        }
      };
    });
  };


  /* Le journal part sur le serveur : le stockage du navigateur ne survit pas
     au navigateur intégré des applis, ni à sept jours de Safari. */
  const envoyer=async()=>{
    if(enVol||!duNeuf) return; enVol=true; duNeuf=false;
    try{ await fetch(URL_ETAT,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(etat)}); }
    catch(e){ duNeuf=true; }
    finally{ enVol=false; if(duNeuf) setTimeout(envoyer,1200); }
  };

  const aujourdhui=()=>new Date().toISOString().slice(0,10);
  const faitsAujourdhui=()=>Object.values(etat).filter(x=>x&&x.date===aujourdhui()).length;


  /* ── Dictée de la note d'appel ─────────────────────────────────────────
     La note voyage avec la décision : `etat[id].note`. */
  const Reco = window.SpeechRecognition || window.webkitSpeechRecognition;

  const blocNote = () =>
    '<div class="note-zone">'
    + '<div class="note-haut">'
    + (Reco
        ? '<button type="button" class="micro" id="micro">'
          + '<span class="pastille"></span>Dicter la note</button>'
        : '')
    + '</div>'
    + '<textarea class="note-txt" id="noteTxt" placeholder="'
    + (Reco ? 'ou tape ici' : 'Ce navigateur ne sait pas transcrire — tape la note ici')
    + '"></textarea>'
    + '<p class="note-aide">' + (Reco
        ? 'Appuie, parle, ré-appuie pour arrêter. La note part avec l’appel.'
        : 'La note part avec l’appel.') + '</p>'
    + '</div>';

  let reco = null;

  const brancherNote = (racine) => {
    const b = racine.querySelector('#micro');
    const t = racine.querySelector('#noteTxt');
    if (!b || !t) return;
    b.onclick = () => {
      if (reco) { reco.stop(); return; }
      reco = new Reco();
      reco.lang = 'fr-FR';
      reco.continuous = true;
      reco.interimResults = true;
      let acquis = t.value ? t.value + ' ' : '';
      reco.onresult = (e) => {
        let vol = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const m = e.results[i][0].transcript;
          if (e.results[i].isFinal) acquis += m + ' '; else vol += m;
        }
        t.value = (acquis + vol).replace(/\s+/g, ' ').trim();
      };
      /* Un refus de micro doit se voir : sinon on croit que ça enregistre. */
      reco.onerror = (e) => {
        b.textContent = e.error === 'not-allowed'
          ? 'Micro refusé — tape la note'
          : 'La dictée a coupé — reprends';
        reco = null;
        b.classList.remove('actif');
      };
      reco.onend = () => { reco = null; b.classList.remove('actif');
        b.innerHTML = '<span class="pastille"></span>Reprendre la dictée'; };
      reco.start();
      b.classList.add('actif');
      b.innerHTML = '<span class="pastille"></span>J’écoute — appuie pour arrêter';
    };
  };

  const lireNote = () => {
    const t = document.getElementById('noteTxt');
    return t ? t.value.trim() : '';
  };

  const suivant=()=>{ while(i<LEADS.length && etat[LEADS[i].id] && etat[LEADS[i].id].date===aujourdhui()) i++; peindre(); };

  const marquer=(r,quoi)=>{ const n=lireNote();
    etat[r.id]={etat:quoi,date:aujourdhui(),h:new Date().toISOString()};
    if(n) etat[r.id].note=n;
    duNeuf=true; envoyer(); i++; suivant(); };

  const rate=(r)=>{
    const pi=document.getElementById('pied');
    pi.innerHTML='<div class="rate"><span class="t">Personne n’a décroché.</span>'
      +'<span class="d">Son numéro est un mobile : le message est déjà écrit, '
      +'il ne reste qu’à l’envoyer.</span></div>'
      +blocWa(r,true)
      +'<button type="button" class="passer" id="passer">Passer au suivant sans message</button>';
    brancherCopie(pi);
    document.getElementById('passer').onclick=()=>marquer(r,'repondu');
    pi.querySelector('.wa-envoi').addEventListener('click',()=>setTimeout(()=>marquer(r,'repondu'),400));
  };

  const peindre=()=>{
    const ec=document.getElementById('ecran'), pi=document.getElementById('pied');
    const fait=faitsAujourdhui();
    document.getElementById('barre').style.width=Math.min(100,(fait/Math.max(1,LEADS.length))*100)+'%';
    document.getElementById('cpt').textContent=fait+' / '+LEADS.length;

    if(i>=LEADS.length){
      ec.innerHTML='<div class="fini"><h2>C’est fini pour aujourd’hui.</h2>'
        +'<p>'+fait+' appel'+(fait>1?'s':'')+' passé'+(fait>1?'s':'')+'. Note ce qui s’est dit sur la feuille pendant que c’est frais.</p></div>';
      pi.innerHTML='<a class="tel" href="../" style="background:#141a26;border-color:#1e2637;color:#f0f3f8">Retour à la feuille</a>';
      return;
    }
    const r=LEADS[i];
    const LIB={echauffement:'échauffement',rappel:'il attend ton appel',vrai:'appel réel'};
    const ouvre=r.script.find(x=>x[0]==='Ouvrir')||r.script[0];
    const reste=r.script.filter(x=>x!==ouvre);

    ec.innerHTML=
      '<span class="badge '+r.cat+'">'+LIB[r.cat]+'</span>'
      +'<h1>'+r.nom+'</h1>'
      +'<div class="meta">'+[r.commune,r.note?r.note+'★':null].filter(Boolean).join(' · ')+'</div>'
      +'<div class="vu">Ce que tu as vu chez eux : <b>'+r.vitrine+'</b></div>'
      +(r.suite?'<div class="vu" style="border-left-color:#FFE600">La dernière fois : '+r.suite+'</div>':'')
      +'<div class="dire"><div class="t">À lire, mot pour mot</div><p>'+ouvre[1]+'</p></div>'
      +'<details><summary>La suite, si ça s’ouvre — et les objections</summary>'
      +reste.map(x=>'<p><b>'+x[0]+'</b>'+x[1]+'</p>').join('')+'</details>';

    pi.innerHTML=
      '<a class="tel" href="tel:'+(r.direct||r.tel).replace(/[^+0-9]/g,'')+'">'
      +'<small>appeler</small>'+(r.direct||r.tel)+'</a>'
      +blocWa(r,false)
      +'<div class="rang trois">'
      +'<button data-q="repondu">Pas décroché</button>'
      +'<button class="parle" data-q="appele">J’ai parlé</button>'
      +'<button class="surplace" data-q="surplace">À voir sur place</button>'
      +'</div>'
      +blocNote()
      +'<div class="note">'+(r.cat==='echauffement'
        ? 'Celui-là ne compte pas. Le but est d’entendre ta voix, pas de vendre.'
        : 'Tu ne notes rien ici : deux boutons, et on passe au suivant.')+'</div>';

    brancherNote(pi);
    pi.querySelectorAll('button:not(.micro)').forEach(b=>b.onclick=()=>{
      if(b.dataset.q==='repondu' && premierMobile(r)) return rate(r);
      marquer(r,b.dataset.q);
    });
    brancherCopie(pi);
  };

  (async()=>{
    LEADS=(await (await fetch('leads.json?t='+Date.now())).json()).leads;
    try{ const j=await (await fetch(URL_ETAT+'?t='+Date.now())).json();
      const d=typeof j.donnees==='string'?JSON.parse(j.donnees||'{}'):(j.donnees||{});
      etat=d&&typeof d==='object'?d:{}; }catch(e){}
    suivant();
  })();
})();
</script>
</body></html>
