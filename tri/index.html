<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Tri</title>
<style>
/* ─────────────────────────────────────────────────────────────────────────
   Deux tris au même endroit : les CLIPS (matière première des hooks) et les
   VIDÉOS (produits finis, à planifier ou à écarter). Même charte, mêmes
   gestes, même cadence — une décision toutes les deux secondes. Aucune
   animation de transition : ce qui coûte du temps est supprimé.

   La différence de fond : une décision sur un clip vit dans ce navigateur ;
   une décision sur une vidéo part sur le serveur, parce qu'une croix doit
   survivre à un vidage de cache. C'est écrit à l'écran, pas seulement ici.
   ───────────────────────────────────────────────────────────────────── */
:root{
  --noir:#08080b; --carte:#121218; --trait:#23232c;
  --poubelle:#e0483b; --debut:#2ea86a; --fin:#3b7fe0; --garder:#e0a020;
  --coeur:#e0483b; --oui:#2ea86a;
  --voix:#e0483b; --doux:#8f8c9a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--noir);color:#f2f0f5;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
[hidden]{display:none!important}

/* ── Les trois onglets ───────────────────────────────────────────────────── */
.onglets{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:6px;
  padding:calc(8px + env(safe-area-inset-top)) 14px 0}
.onglets.t3{grid-template-columns:1fr 1fr 1fr}
.onglets button{padding:11px 8px;border-radius:10px 10px 0 0;border:1px solid var(--trait);
  border-bottom:none;background:#0d0d12;color:var(--doux);font:inherit;font-size:13px;
  font-weight:600;letter-spacing:.05em;cursor:pointer;min-height:44px}
.onglets button.on{background:var(--carte);color:#fff;border-color:#3a3a48}
.onglets button i{display:block;font-style:normal;font-size:11px;font-weight:400;
  opacity:.65;letter-spacing:0;margin-top:2px}

/* ── Haut : compteur et progression ─────────────────────────────────────── */
.haut{flex:0 0 auto;padding:10px 14px 8px}
.ligne{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.compteur{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.compteur small{font-size:13px;color:var(--doux);font-weight:400}
.outils{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.outils button,.outils select{padding:6px 11px;border-radius:8px;border:1px solid var(--trait);
  background:var(--carte);color:#f2f0f5;font:inherit;font-size:12.5px;cursor:pointer}
.outils button:hover{border-color:#555}
.jauge{height:4px;background:#1b1b22;border-radius:2px;margin-top:8px;overflow:hidden}
.jauge i{display:block;height:100%;background:#fff;width:0}
.titre{font-size:12px;color:var(--doux);margin-top:6px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}

/* ── La vidéo ───────────────────────────────────────────────────────────── */
.scene{flex:1 1 auto;position:relative;display:flex;align-items:center;
  justify-content:center;min-height:0;padding:4px 0}
video{max-height:100%;max-width:100%;aspect-ratio:9/16;background:#000;
  border-radius:12px;display:block;object-fit:contain}
.badge{position:absolute;top:12px;left:50%;transform:translateX(-50%);
  background:var(--voix);color:#fff;font-weight:700;font-size:13px;
  letter-spacing:.08em;padding:6px 14px;border-radius:999px;display:none}
.badge.on{display:block}
.son{position:absolute;right:14px;bottom:14px;min-width:56px;height:44px;border-radius:22px;
  border:1px solid var(--trait);background:rgba(8,8,11,.78);color:#fff;
  font:600 12px/1 system-ui,sans-serif;letter-spacing:.06em;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.fin{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;text-align:center;padding:20px}
.fin.on{display:flex}
.fin h2{font-size:26px}
.fin p{color:var(--doux);max-width:40ch;font-size:14px}
.fin button{padding:11px 20px;border-radius:10px;border:1px solid var(--trait);
  background:var(--carte);color:#fff;font:inherit;cursor:pointer;min-height:44px}

/* ── Étiquettes rapides (clips) ─────────────────────────────────────────── */
.tags{flex:0 0 auto;display:flex;gap:5px;flex-wrap:wrap;padding:6px 14px 0}
.tags button{padding:5px 10px;border-radius:999px;border:1px solid var(--trait);
  background:var(--carte);color:var(--doux);font:inherit;font-size:12px;cursor:pointer}
.tags button.on{border-color:#fff;color:#fff;background:#22222b}
.tags button b{color:#6f6c7a;font-weight:700;margin-right:5px}
.tags button.on b{color:#fff}
.note{flex:0 0 auto;padding:6px 14px 0}
.note input{width:100%;padding:8px 11px;border-radius:8px;border:1px solid var(--trait);
  background:var(--carte);color:#f2f0f5;font:inherit;font-size:13px}
.note input::placeholder{color:#5d5a68}

/* ── Bas : les décisions ────────────────────────────────────────────────── */
.actions{flex:0 0 auto;display:grid;gap:6px;
  padding:8px 14px calc(10px + env(safe-area-inset-bottom))}
.actions.q4{grid-template-columns:repeat(4,1fr)}
.actions.q2{grid-template-columns:repeat(2,1fr)}
.actions button{padding:13px 6px;border-radius:12px;border:2px solid;background:var(--carte);
  color:#fff;font:inherit;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:3px;line-height:1.25;min-height:56px}
.actions .k{font-size:19px;font-weight:700}
.actions .l{font-size:11px;letter-spacing:.04em;text-align:center;opacity:.85}
#bPoubelle{border-color:var(--poubelle)} #bPoubelle .k{color:var(--poubelle)}
#bDebut{border-color:var(--debut)}       #bDebut .k{color:var(--debut)}
#bFin{border-color:var(--fin)}           #bFin .k{color:var(--fin)}
#bGarder{border-color:var(--garder)}     #bGarder .k{color:var(--garder)}
#bCroix{border-color:var(--coeur)}       #bCroix .k{color:var(--coeur)}
#bCoeur{border-color:var(--oui)}         #bCoeur .k{color:var(--oui)}
#bStylo{border-color:#FFB020}            #bStylo .k{color:#FFB020}
.actions.q3{grid-template-columns:repeat(3,1fr)}
.creer{flex:1 1 auto;overflow-y:auto;padding:14px 2px 20px}
.creer .cl{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--or);font-weight:700;margin:16px 0 7px}
.creer .cl .mini{float:right;font:inherit;font-size:11px;font-weight:700;letter-spacing:.02em;
  text-transform:none;background:none;border:0;color:#8B8B96;text-decoration:underline;cursor:pointer}
.creer select,.creer textarea,.creer input[type=text]{width:100%;background:#0f0f14;color:#F3F3F7;
  border:1px solid var(--trait);border-radius:12px;padding:13px;font:inherit;font-size:15.5px;
  min-height:48px}
.creer textarea{resize:vertical}
.caide{font-size:13px;color:#8B8B96;margin-top:7px;line-height:1.5}
.caide a{color:var(--or)}
.ctags{display:flex;flex-wrap:wrap;gap:8px}
.ctags button{font:inherit;font-size:14px;font-weight:600;padding:10px 14px;border-radius:999px;
  border:1px solid var(--trait);background:#0f0f14;color:#C9CCD4;cursor:pointer;min-height:44px}
.ctags button.on{background:var(--or);color:#141400;border-color:var(--or)}
.cbar{display:flex;gap:9px;margin-top:20px}
.cbar button{flex:1 1 0;font:inherit;font-size:15px;font-weight:700;padding:14px 10px;
  border-radius:12px;border:1px solid var(--trait);background:#0f0f14;color:#C9CCD4;cursor:pointer}
.cbar button.p{background:var(--or);color:#141400;border-color:var(--or)}
.ccmd{background:#000;border:1px solid var(--trait);border-radius:12px;padding:13px;margin-top:14px;
  font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.55;color:#D6DBD9;
  white-space:pre-wrap;word-break:break-word;max-height:260px;overflow-y:auto}
#cCopier{width:100%;margin-top:10px;font:inherit;font-size:15px;font-weight:700;padding:14px;
  border-radius:12px;border:1px solid var(--or);background:var(--or);color:#141400;cursor:pointer}
.voile{position:fixed;inset:0;background:rgba(6,6,8,.86);z-index:60;display:flex;
  align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.voile[hidden]{display:none}
.pan{width:100%;max-width:560px;background:#141419;border:1px solid #23232c;
  border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto}
.pan-t{font-size:19px;font-weight:700;color:#F3F3F7;letter-spacing:-.02em}
.pan-s{font-size:13.5px;color:#8B8B96;margin:4px 0 16px;word-break:break-word}
.tags{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px}
.tags button{font:inherit;font-size:14.5px;font-weight:600;padding:11px 15px;border-radius:999px;
  border:1px solid #23232c;background:#0f0f14;color:#C9CCD4;cursor:pointer;min-height:44px}
.tags button.on{background:#FFB020;color:#1a1000;border-color:#FFB020}
.tags button .n{opacity:.55;font-size:12px;margin-left:5px;font-variant-numeric:tabular-nums}
.tags button.on .n{opacity:.7}
.pan textarea{width:100%;background:#0f0f14;color:#F3F3F7;border:1px solid #23232c;
  border-radius:12px;padding:12px;font:inherit;font-size:15px;resize:vertical}
.pan-b{display:flex;gap:10px;margin-top:14px}
.pan-b button{flex:1 1 0;font:inherit;font-size:15px;font-weight:700;padding:13px;
  border-radius:12px;border:1px solid #23232c;background:#0f0f14;color:#C9CCD4;cursor:pointer}
.pan-b button.p{background:#FFB020;color:#1a1000;border-color:#FFB020}

/* ── Le bandeau d'état : jamais d'échec silencieux ──────────────────────── */
.etat{flex:0 0 auto;padding:6px 14px 0;font-size:12.5px;color:var(--doux);
  min-height:20px;line-height:1.4}
.etat b{color:#f2f0f5}
.etat.ok b{color:#7bebb0}
.etat.ko b{color:#f3b9c0}

.depot{position:fixed;inset:0;background:var(--noir);display:none;
  flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;z-index:20}
.depot.on{display:flex}
.depot .zone{border:2px dashed var(--trait);border-radius:16px;padding:44px 30px;
  text-align:center;color:var(--doux);max-width:460px}
.depot .zone b{color:#fff;display:block;margin-bottom:8px;font-size:17px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="onglets t3">
  <button id="ongClips" class="on">CLIPS <i>la matière</i></button>
  <button id="ongVideos">VIDÉOS <i>croix ou cœur</i></button>
  <button id="ongCreer">CRÉER <i>une nouvelle</i></button>
</div>

<div class="haut">
  <div class="ligne">
    <div class="compteur"><span id="fait">0</span> / <span id="tot">0</span>
      <small id="restant"></small></div>
    <div class="outils" id="outilsClips">
      <button id="oExport">Exporter</button>
      <button id="oImport">Importer</button>
      <button id="oReset">Reset</button>
    </div>
    <div class="outils" id="outilsVideos" hidden>
      <select id="oFamille"><option value="">toutes familles</option></select>
      <button id="oRevoir">Tout revoir</button>
    </div>
  </div>
  <div class="jauge"><i id="jauge"></i></div>
  <div class="titre" id="titre"></div>
</div>

<div class="scene">
  <video id="v" playsinline muted loop preload="auto"></video>
  <div class="badge" id="badgeVoix">VOIX À COUPER</div>
  <button class="son" id="bSon" title="Son (M)">MUET</button>
  <div class="fin" id="ecranFin">
    <h2 id="finTitre">Tri terminé.</h2>
    <p id="finTexte"></p>
    <button id="finExport">Exporter le tri</button>
  </div>
</div>

<div class="tags" id="tags"></div>
<div class="note" id="zoneNote"><input id="note"
  placeholder="Note libre (T pour écrire, Échap pour sortir) — ce qu'on voit, pour retrouver le clip plus tard"></div>
<div class="etat" id="etat" hidden></div>

<div class="actions q4" id="actClips">
  <button id="bPoubelle"><span class="k">←</span><span class="l">POUBELLE</span></button>
  <button id="bDebut"><span class="k">↑</span><span class="l">HOOK DÉBUT</span></button>
  <button id="bFin"><span class="k">↓</span><span class="l">HOOK FIN</span></button>
  <button id="bGarder"><span class="k">→</span><span class="l">GARDER</span></button>
</div>

<div class="actions q3" id="actVideos" hidden>
  <button id="bCroix"><span class="k">✗</span><span class="l">ABANDONNER</span></button>
  <button id="bStylo"><span class="k">✎</span><span class="l">MODIFIER</span></button>
  <button id="bCoeur"><span class="k">♥</span><span class="l">PLANIFIER</span></button>
</div>

<div class="voile" id="voileMod" hidden>
  <div class="pan">
    <div class="pan-t">Qu'est-ce qu'il faut corriger&nbsp;?</div>
    <div class="pan-s" id="modTitre"></div>
    <div class="tags" id="modTags"></div>
    <textarea id="modNote" rows="3" placeholder="Précise si besoin — ce que tu écris ici me revient tel quel."></textarea>
    <div class="pan-b">
      <button id="modAnnuler">Annuler</button>
      <button id="modOk" class="p">Enregistrer</button>
    </div>
  </div>
</div>

<section class="creer" id="panCreer" hidden>
  <label class="cl" for="cStyle">Le style</label>
  <select id="cStyle"></select>
  <p class="caide" id="cStyleAide"></p>

  <label class="cl" for="cSujet">De quoi ça parle</label>
  <textarea id="cSujet" rows="4" placeholder="Le sujet, l'angle, ce que tu veux dire. Écris comme tu parles."></textarea>

  <label class="cl">Hashtags <span id="cNbTags">3</span>/5
    <button type="button" class="mini" id="cResetTags">remettre les 3</button></label>
  <div class="ctags" id="cTags"></div>

  <label class="cl" for="cMot">Le mot à commenter</label>
  <input id="cMot" type="text" placeholder="OUTILS, MENU, PROMPT…" autocapitalize="characters">

  <div class="cbar">
    <button id="cValider" class="p">Valider et préparer</button>
    <button id="cSouci">Un souci sur ce style</button>
  </div>
  <pre class="ccmd" id="cCmd" hidden></pre>
  <button class="p" id="cCopier" hidden>Copier la commande</button>
</section>

<div class="depot" id="depot">
  <div class="zone" id="zone">
    <b>clips.json introuvable</b>
    Dépose le fichier ici, ou clique pour le choisir.<br>
    Format : [{ "id", "url", "date" }]
  </div>
  <input type="file" id="fJson" accept="application/json" hidden>
</div>
<input type="file" id="fImport" accept="application/json" hidden>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var v = $('v'), note = $('note');
  var mode = 'clips', son = false;

  /* ═══════════════ commun ═══════════════ */
  var precharge = [];
  function precharger(urls){
    precharge.forEach(function(e){ e.src = ''; });
    precharge = [];
    urls.forEach(function(u){
      var p = document.createElement('video');
      p.preload = 'auto'; p.muted = true; p.src = u;
      precharge.push(p);
    });
  }
  function basculerSon(){
    son = !son; v.muted = !son;
    $('bSon').textContent = son ? 'SON' : 'MUET';
  }
  $('bSon').addEventListener('click', basculerSon);

  function dire(texte, classe){
    var e = $('etat');
    e.hidden = false;
    e.className = 'etat' + (classe ? ' ' + classe : '');
    e.innerHTML = texte;
  }

  /* ═══════════════ onglet CLIPS ═══════════════
     Repris tel quel du tri des hooks, même clé de stockage : les décisions
     déjà prises se retrouvent en ouvrant cette page. */
  var CLE = 'tri_clips';
  var TAGS = ['visage','voiture','ville','nature','écran','action','lent','b-roll'];
  var clips = [], deci = {}, i = 0, voix = false, tags = {};

  function lire(){ try { return JSON.parse(localStorage.getItem(CLE)) || {}; } catch(e){ return {}; } }
  function ecrire(){ try { localStorage.setItem(CLE, JSON.stringify(deci)); } catch(e){} }

  function premierNonTrie(){
    for (var k = 0; k < clips.length; k++) if (!deci[clips[k].id]) return k;
    return clips.length;
  }
  function majTags(){
    var z = $('tags');
    z.innerHTML = '';
    TAGS.forEach(function(t, n){
      var b = document.createElement('button');
      b.innerHTML = '<b>' + (n + 1) + '</b>' + t;
      if (tags[t]) b.className = 'on';
      b.addEventListener('click', function(){ basculeTag(t); });
      z.appendChild(b);
    });
  }
  function basculeTag(t){ tags[t] = !tags[t]; if (!tags[t]) delete tags[t]; majTags(); }

  function afficherClips(){
    var n = Object.keys(deci).length;
    $('fait').textContent = n;
    $('tot').textContent = clips.length;
    $('jauge').style.width = (clips.length ? n / clips.length * 100 : 0) + '%';
    $('restant').textContent = clips.length ? '· ' + (clips.length - n) + ' restants' : '';

    if (i >= clips.length){
      $('finTitre').textContent = 'Tri terminé.';
      $('finTexte').textContent = 'Tous les clips sont passés. Exporte le résultat, ou appuie sur Z pour revenir en arrière.';
      $('finExport').hidden = false;
      $('ecranFin').classList.add('on');
      v.style.display = 'none'; $('titre').textContent = '';
      return;
    }
    $('ecranFin').classList.remove('on');
    v.style.display = '';
    var c = clips[i];
    if (v.src !== c.url){ v.removeAttribute('poster'); v.src = c.url; v.load(); }
    v.muted = !son;
    v.play().catch(function(){});
    $('titre').textContent = (i + 1) + '. ' + (c.titre || c.id);
    voix = false; tags = {}; note.value = '';
    $('badgeVoix').classList.remove('on');
    majTags();
    var u = [];
    for (var k = i + 1; k <= i + 3 && k < clips.length; k++) u.push(clips[k].url);
    precharger(u);
  }

  function deciderClip(role){
    if (i >= clips.length) return;
    var c = clips[i];
    deci[c.id] = { id: c.id, url: c.url, role: role, couper_voix: voix,
      tags: Object.keys(tags), note: note.value.trim(), ordre: i };
    ecrire(); i++; afficherClips();
  }
  function annulerClip(){
    var k = i - 1;
    while (k >= 0 && !deci[clips[k].id]) k--;
    if (k < 0) return;
    delete deci[clips[k].id];
    ecrire(); i = k; afficherClips();
  }

  function exporter(){
    var out = Object.keys(deci).map(function(k){ return deci[k]; })
      .filter(function(d){ return d.role !== 'POUBELLE'; })
      .sort(function(a, b){ return a.ordre - b.ordre; })
      .map(function(d){ return { id: d.id, url: d.url, role: d.role,
        couper_voix: d.couper_voix, tags: d.tags || [], note: d.note || '' }; });
    var b = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b); a.download = 'tri_resultat.json';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 800);
  }
  $('oExport').addEventListener('click', exporter);
  $('finExport').addEventListener('click', exporter);
  $('oImport').addEventListener('click', function(){ $('fImport').click(); });
  $('fImport').addEventListener('change', function(e){
    var f = e.target.files[0]; if (!f) return;
    f.text().then(function(t){
      try {
        JSON.parse(t).forEach(function(d, n){
          deci[d.id] = { id: d.id, url: d.url, role: d.role,
            couper_voix: !!d.couper_voix, tags: d.tags || [], note: d.note || '', ordre: n };
        });
        ecrire(); i = premierNonTrie(); afficherClips();
      } catch(err){ alert('Fichier illisible : ' + err.message); }
    });
  });
  $('oReset').addEventListener('click', function(){
    if (!confirm('Effacer tout le tri des clips ? Cette action est définitive.')) return;
    deci = {}; try { localStorage.removeItem(CLE); } catch(e){}
    i = 0; afficherClips();
  });

  function demarrerClips(l){
    clips = l.filter(function(c){ return c && c.id && c.url; });
    deci = lire(); i = premierNonTrie();
    $('depot').classList.remove('on');
    if (mode === 'clips') afficherClips();
  }

  /* ═══════════════ onglet VIDÉOS ═══════════════
     Deux décisions seulement, et elles ne restent PAS dans le navigateur :
       ✗ part au registre des refus, côté serveur — une vidéo écartée ne
         pourra plus être proposée à la planification, même après un vidage
         de cache ou depuis un autre téléphone.
       ♥ part dans le Sheet de suivi, qui est ce que lit le workflow de
         planification. Rien n'est publié depuis cette page.
     Un envoi qui échoue est réessayé et reste affiché : jamais de silence. */
  var API = 'https://n7n.automatisationboost.com/webhook/video-decision';
  var CLEV = 'tri_videos';
  var vids = [], vue = [], vdeci = {}, j = 0, famille = '', nbRefus = null;
  var file = [];              /* envois en attente : un échec ne perd rien */
  var enVol = false;

  function lireV(){ try { return JSON.parse(localStorage.getItem(CLEV)) || {}; } catch(e){ return {}; } }
  function ecrireV(){ try { localStorage.setItem(CLEV, JSON.stringify(vdeci)); } catch(e){} }

  function pousser(){
    if (enVol || !file.length) return;
    enVol = true;
    var t = file[0];
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                 body: JSON.stringify(t.corps) })
      .then(function(r){ return r.json().catch(function(){ return { ok: false, message: 'réponse illisible' }; })
        .then(function(j2){ return { s: r.status, j: j2 }; }); })
      .then(function(res){
        file.shift();
        var d = vdeci[t.corps.route];
        if (d) { d.envoye = true; d.reponse = res.j; ecrireV(); }
        if (res.j && res.j.ok){
          if (t.corps.decision === 'modifier')
            dire('<b>✎ noté</b> — « ' + t.titre + ' » est marquée à corriger' +
                 ((t.corps.tags && t.corps.tags.length) ? ' (' + t.corps.tags.join(', ') + ')' : '') +
                 '. Elle reste planifiable une fois refaite.', 'ok');
          else if (t.corps.decision === 'refus')
            dire('<b>✗ enregistré</b> — « ' + t.titre + ' » est au registre des refus (' +
                 (res.j.refuses || '?') + ' au total). Elle ne pourra plus être planifiée.', 'ok');
          else if (res.j.action === 'append')
            dire('<b>♥ envoyé</b> — « ' + t.titre + ' » ajoutée au Sheet de suivi. ' +
                 'Il lui manque la légende TikTok avant que la planification la prenne.', 'ok');
          else
            dire('<b>♥ validé</b> — « ' + t.titre + ' » passée en « ✅ Validé » ligne ' +
                 res.j.ligne + '. La planification la prendra au prochain passage.', 'ok');
        } else {
          dire('<b>refusé par le serveur</b> — ' + ((res.j && res.j.message) || ('HTTP ' + res.s)), 'ko');
        }
      })
      .catch(function(){
        dire('<b>envoi impossible</b> — je réessaie. Ne ferme pas la page.', 'ko');
      })
      .then(function(){ enVol = false; if (file.length) setTimeout(pousser, 1200); });
  }

  /* Ce qui est deja ecarte se redit a chaque fois qu'on revient sur l'onglet :
     sinon l'info arrive avant que Tony regarde, et disparait. */
  function rappelRefus(){
    if (nbRefus === null) return;
    if (nbRefus < 0)
      dire('<b>Registre des refus injoignable</b> — une vidéo déjà écartée peut ' +
           'réapparaître. Recharge avant de décider.', 'ko');
    else
      dire(nbRefus + ' vidéo(s) déjà au registre des refus · ✗ y écrit, ♥ écrit dans le Sheet de suivi.', '');
  }

  function filtrer(){
    vue = vids.filter(function(x){ return !famille || x.famille === famille; });
  }

  function afficherVideos(){
    var n = vue.filter(function(x){ return vdeci[x.route]; }).length;
    $('fait').textContent = n;
    $('tot').textContent = vue.length;
    $('jauge').style.width = (vue.length ? n / vue.length * 100 : 0) + '%';
    $('restant').textContent = vue.length ? '· ' + (vue.length - n) + ' restantes' : '';

    if (j >= vue.length){
      $('finTitre').textContent = 'Tout est passé.';
      $('finTexte').textContent = vue.length
        ? 'Les croix sont au registre des refus, les cœurs sont dans le Sheet de suivi. Z pour revenir en arrière.'
        : 'Aucune vidéo dans cette famille.';
      $('finExport').hidden = true;
      $('ecranFin').classList.add('on');
      v.style.display = 'none'; $('titre').textContent = '';
      return;
    }
    $('ecranFin').classList.remove('on');
    v.style.display = '';
    var c = vue[j];
    var url = '/' + c.route + '/video.mp4';
    if (v.getAttribute('src') !== url){
      v.poster = '/videos/vignettes/' + c.route + '.jpg';
      v.src = url; v.load();
    }
    v.muted = !son;
    v.play().catch(function(){});
    $('titre').textContent = (j + 1) + '. ' + c.titre + ' · ' + c.famille +
      ' · ' + c.duree + ' s · ' + c.date;
    var u = [];
    for (var k = j + 1; k <= j + 2 && k < vue.length; k++) u.push('/' + vue[k].route + '/video.mp4');
    precharger(u);
  }

  function premiereNonTrieeV(){
    for (var k = 0; k < vue.length; k++) if (!vdeci[vue[k].route]) return k;
    return vue.length;
  }

  /* Les décisions qui n'ont jamais atteint le serveur repartent au chargement.
     Sans ça, « un échec ne perd rien » n'était vrai que dans l'onglet ouvert :
     la file vit en mémoire et personne ne la relisait. Constaté le 04/09/2026,
     n8n répondant 503 — tout tri fait pendant la panne aurait disparu à la
     fermeture de l'onglet, sans un mot.

     On ne renvoie QUE les entrées marquées envoye:false. Celles d'avant ce
     correctif n'ont pas le champ : elles sont laissées tranquilles, car on ne
     peut pas savoir si elles sont parties, et un doublon de refus vaut moins
     qu'une décision perdue — mais un doublon reste un dégât. */
  function renvoyerEnAttente(){
    var n = 0;
    vids.forEach(function(x){
      var d = vdeci[x.route];
      if (!d || d.envoye !== false) return;
      var corps = { route: d.route, titre: x.titre,
        url: 'https://previsualisation.automatisationboost.com/' + d.route + '/video.mp4',
        decision: d.decision === 'croix' ? 'refus' : (d.decision === 'stylo' ? 'modifier' : 'planifier') };
      if (d.decision === 'stylo'){ corps.tags = d.tags || []; corps.note = d.note || ''; }
      file.push({ titre: x.titre, corps: corps });
      n++;
    });
    if (n){
      dire('<b>' + n + ' décision' + (n > 1 ? 's' : '') + ' jamais parvenue' +
           (n > 1 ? 's' : '') + ' au serveur</b> — renvoi en cours…', '');
      pousser();
    }
  }

  function deciderVideo(quoi, tags, note){
    if (j >= vue.length) return;
    var c = vue[j];
    vdeci[c.route] = { route: c.route, decision: quoi, tags: tags || [], note: note || '',
                       at: new Date().toISOString(), envoye: false };
    ecrireV();
    var corps = { route: c.route, titre: c.titre,
      url: 'https://previsualisation.automatisationboost.com/' + c.route + '/video.mp4',
      decision: quoi === 'croix' ? 'refus' : (quoi === 'stylo' ? 'modifier' : 'planifier') };
    if (quoi === 'stylo'){ corps.tags = tags || []; corps.note = note || ''; }
    file.push({ titre: c.titre, corps: corps });
    dire('Envoi en cours…', '');
    pousser();
    j++; afficherVideos();
  }

  /* Le retour arrière n'est pas symétrique, et c'est dit à l'écran : une croix
     se retire du registre, un cœur a déjà écrit dans le Sheet et doit s'y
     retirer à la main. Prétendre le contraire ferait repartir une vidéo. */
  function annulerVideo(){
    var k = j - 1;
    while (k >= 0 && !vdeci[vue[k].route]) k--;
    if (k < 0) return;
    var c = vue[k], d = vdeci[c.route];
    delete vdeci[c.route]; ecrireV();
    if (d.decision === 'croix'){
      file.push({ titre: c.titre, corps: { route: c.route, titre: c.titre, decision: 'annuler-refus' } });
      dire('Retour en arrière — la croix est retirée du registre.', '');
      pousser();
    } else {
      dire('<b>Retour en arrière</b> — mais « ' + c.titre + ' » est déjà écrite dans le ' +
           'Sheet de suivi. Retire la ligne à la main si tu n\'en veux plus.', 'ko');
    }
    j = k; afficherVideos();
  }

  $('oRevoir').addEventListener('click', function(){
    if (!confirm('Repasser toutes les vidéos, y compris celles déjà décidées ?')) return;
    j = 0; afficherVideos();
  });
  $('oFamille').addEventListener('change', function(e){
    famille = e.target.value; filtrer(); j = premiereNonTrieeV(); afficherVideos();
  });

  function demarrerVideos(l){
    vids = l.filter(function(x){ return x && x.route; });
    vdeci = lireV();
    var fams = [];
    vids.forEach(function(x){ if (fams.indexOf(x.famille) < 0) fams.push(x.famille); });
    fams.sort().forEach(function(f){
      var o = document.createElement('option'); o.value = f; o.textContent = f;
      $('oFamille').appendChild(o);
    });
    filtrer();
    renvoyerEnAttente();
    /* Les croix déjà posées ailleurs (autre téléphone, cache vidé) reviennent
       du serveur : sans ça la page reproposerait une vidéo écartée. */
    fetch(API + '?t=' + Date.now()).then(function(r){ return r.json(); }).then(function(g){
      var l2 = typeof g.refus === 'string' ? JSON.parse(g.refus || '[]') : (g.refus || []);
      l2.forEach(function(x){
        if (x && x.route && !vdeci[x.route])
          vdeci[x.route] = { route: x.route, decision: 'croix', at: x.date, envoye: true };
      });
      ecrireV();
      nbRefus = l2.length;
      j = premiereNonTrieeV();
      if (mode === 'videos'){ afficherVideos(); rappelRefus(); }
    }).catch(function(){
      nbRefus = -1;
      j = premiereNonTrieeV();
      if (mode === 'videos'){
        afficherVideos();
        dire('<b>Registre des refus injoignable</b> — une vidéo déjà écartée peut ' +
             'réapparaître. Recharge avant de décider.', 'ko');
      }
    });
    j = premiereNonTrieeV();
    if (mode === 'videos') afficherVideos();
  }

  /* ═══════════════ bascule d'onglet ═══════════════ */
  function versMode(m){
    mode = m;
    var c = m === 'clips', vd = m === 'videos', cr = m === 'creer';
    $('ongClips').classList.toggle('on', c);
    $('ongVideos').classList.toggle('on', vd);
    $('ongCreer').classList.toggle('on', cr);
    /* CRÉER n'est pas un tri : ni lecteur, ni boutons de décision, ni dépôt. */
    $('panCreer').hidden = !cr;
    document.querySelector('.scene').hidden = cr;
    $('outilsClips').hidden = !c;
    $('outilsVideos').hidden = !vd;
    $('actClips').hidden = !c;
    $('actVideos').hidden = !vd;
    $('tags').hidden = !c;
    $('zoneNote').hidden = !c;
    $('etat').hidden = !vd;
    if (cr){ try { localStorage.setItem('tri_onglet', m); } catch(e){} return; }
    $('badgeVoix').classList.remove('on');
    v.removeAttribute('src'); v.removeAttribute('poster'); v.load();
    try { localStorage.setItem('tri_onglet', m); } catch(e){}
    if (c) afficherClips(); else { afficherVideos(); rappelRefus(); }
  }
  /* ═══════════════ onglet CRÉER ═══════════════
     Huit styles, tous déjà montés au moins une fois. Chacun renvoie vers un
     exemple réel : un style qu'on ne peut pas montrer n'est pas un style, c'est
     une intention. */
  var STYLES = [
    { id:'cartes-avatar', nom:'Cartes numérotées + avatar',
      aide:"Un compteur, une carte par point, une jauge de progression, l'avatar qui ouvre. Le plus lisible pour une liste.",
      ex:'sept-choses', duree:'40-45 s' },
    { id:'prompt-reveal', nom:'Prompt reveal',
      aide:"Le rendu IA en plein cadre, le prompt qui défile en dessous, l'écran qui se verrouille, puis le mot à commenter.",
      ex:'', duree:'25-30 s' },
    { id:'journal-ia', nom:'Journal IA',
      aide:"4 à 6 brèves avec leurs chiffres et leurs sources, deux running gags, avatar en ponctuation.",
      ex:'', duree:'45-60 s' },
    { id:'split', nom:'Split b-roll / avatar',
      aide:"B-roll en haut, toi en bas dans une carte arrondie, la légende sur la couture.",
      ex:'', duree:'20-30 s' },
    { id:'beatsync', nom:'Beat-sync images',
      aide:"Plusieurs visuels coupés sur le rythme, grille de beats mesurée sur la piste.",
      ex:'foodboost-post-demo', duree:'15-20 s' },
    { id:'vitrine', nom:'Vitrine plats (FoodBoost)',
      aide:"Cinémagraphes de plats, nom + accroche par plan, carton final. Pour un restaurant.",
      ex:'foodboost-post-demo', duree:'9-20 s' },
    { id:'capture', nom:'Capture commentée',
      aide:"Un site ou une page filmée qui défile, avec des cartes qui entrent aux bons moments.",
      ex:'cv-interactif', duree:'30-40 s' },
    { id:'essai', nom:'Essai contemplatif',
      aide:"Long, lent, très peu de texte. Une idée suivie jusqu'au bout, sans CTA qui pousse.",
      ex:'', duree:'3-7 min' },
  ];
  /* Relevés sur ses 40 derniers posts TikTok publiés, pas supposés. */
  var TAGS3 = ['automatisation', 'ia', 'n8n'];
  var TAGS_SUGG = ['automatisation','ia','n8n','videoIA','freelance','veilleIA',
                   'AutomationBoost','prompt','seedance','contenu','claudecode','reunion'];
  var tagsChoisis = new Set(TAGS3);

  function remplirStyles(){
    var sel = $('cStyle');
    sel.innerHTML = STYLES.map(function(x){
      return '<option value="' + x.id + '">' + x.nom + ' — ' + x.duree + '</option>'; }).join('');
    majAide();
  }
  function styleCourant(){ return STYLES.filter(function(x){ return x.id === $('cStyle').value; })[0]; }
  function majAide(){
    var x = styleCourant(); if (!x) return;
    $('cStyleAide').innerHTML = x.aide +
      (x.ex ? ' <a href="/' + x.ex + '/" target="_blank" rel="noopener">voir un exemple</a>'
            : ' <i>(pas encore d\'exemple en ligne)</i>');
  }
  function dessinerTagsC(){
    var el = $('cTags'); el.innerHTML = '';
    TAGS_SUGG.forEach(function(t){
      var b = document.createElement('button'); b.type = 'button'; b.textContent = '#' + t;
      if (tagsChoisis.has(t)) b.className = 'on';
      b.addEventListener('click', function(){
        if (tagsChoisis.has(t)) { tagsChoisis.delete(t); b.classList.remove('on'); }
        else {
          /* Cinq maximum : Instagram refuse au-dela et le post part en echec. */
          if (tagsChoisis.size >= 5){ dire('<b>Cinq hashtags maximum</b> — Instagram rejette au-delà.', 'ko'); return; }
          tagsChoisis.add(t); b.classList.add('on');
        }
        $('cNbTags').textContent = tagsChoisis.size;
      });
      el.appendChild(b);
    });
    $('cNbTags').textContent = tagsChoisis.size;
  }

  $('cStyle').addEventListener('change', majAide);
  $('cResetTags').addEventListener('click', function(){
    tagsChoisis = new Set(TAGS3); dessinerTagsC();
  });

  $('cValider').addEventListener('click', function(){
    var x = styleCourant();
    var sujet = $('cSujet').value.trim();
    var mot = $('cMot').value.trim().toUpperCase();
    if (!sujet){ dire('<b>Dis de quoi ça parle</b> — sans sujet je ne peux rien monter.', 'ko'); return; }
    var brief = 'Fais-moi une vidéo.\n\n'
      + 'Style   : ' + x.nom + ' (' + x.id + ', ' + x.duree + ')\n'
      + 'Sujet   : ' + sujet + '\n'
      + 'Hashtags: ' + [...tagsChoisis].map(function(t){ return '#' + t; }).join(' ') + '\n'
      + (mot ? 'Mot-clé : commente ' + mot + '\n' : '')
      + '\nRappels : ouvre sur l\'avatar qui parle (pas sur un b-roll), musique libre de droits '
      + 'et pas celle de la dernière vidéo, CTA explicite à la fin.';
    $('cCmd').textContent = brief;
    $('cCmd').hidden = false; $('cCopier').hidden = false;
    try { localStorage.setItem('tri-dernier-brief', brief); } catch(e){}
    dire('<b>Brief prêt</b> — copie-le et passe-le-moi. Le rendu tourne sur ta machine, '
       + 'pas dans le navigateur : c\'est cette ligne qui fait le pont.', 'ok');
    $('cCmd').scrollIntoView({ behavior:'smooth', block:'nearest' });
  });

  $('cCopier').addEventListener('click', async function(){
    var b = this;
    try { await navigator.clipboard.writeText($('cCmd').textContent);
          b.textContent = 'Copié'; } catch(e){ b.textContent = 'Copie refusée'; }
    setTimeout(function(){ b.textContent = 'Copier la commande'; }, 1800);
  });

  $('cSouci').addEventListener('click', function(){
    var x = styleCourant();
    var quoi = prompt('Qu\'est-ce qui cloche avec « ' + x.nom + ' » ?');
    if (!quoi || !quoi.trim()) return;
    var txt = 'Souci sur le style « ' + x.nom + ' » (' + x.id + ') : ' + quoi.trim();
    $('cCmd').textContent = txt; $('cCmd').hidden = false; $('cCopier').hidden = false;
    try { localStorage.setItem('tri-dernier-souci', txt); } catch(e){}
    dire('<b>Noté</b> — copie la ligne et passe-la-moi, je regarde le style.', 'ok');
  });

  remplirStyles(); dessinerTagsC();

  $('ongClips').addEventListener('click', function(){ versMode('clips'); });
  $('ongVideos').addEventListener('click', function(){ versMode('videos'); });
  $('ongCreer').addEventListener('click', function(){ versMode('creer'); });

  /* ═══════════════ clavier ═══════════════ */
  document.addEventListener('keydown', function(e){
    if (document.activeElement === note){
      if (e.key === 'Escape' || e.key === 'Enter'){ note.blur(); e.preventDefault(); }
      return;
    }
    var k = e.key;
    if (k === 'z' || k === 'Z'){ mode === 'clips' ? annulerClip() : annulerVideo(); return; }
    if (k === ' '){ if (v.paused) v.play(); else v.pause(); e.preventDefault(); return; }
    if (k === 'r' || k === 'R'){ v.currentTime = 0; v.play().catch(function(){}); return; }
    if (k === 'm' || k === 'M'){ basculerSon(); return; }
    if (mode === 'clips'){
      if (k === 'ArrowLeft')       { deciderClip('POUBELLE');   e.preventDefault(); }
      else if (k === 'ArrowUp')    { deciderClip('HOOK_DEBUT'); e.preventDefault(); }
      else if (k === 'ArrowDown')  { deciderClip('HOOK_FIN');   e.preventDefault(); }
      else if (k === 'ArrowRight') { deciderClip('GARDER');     e.preventDefault(); }
      else if (k === 'v' || k === 'V'){
        voix = !voix; $('badgeVoix').classList.toggle('on', voix);
      }
      else if (k === 't' || k === 'T'){ note.focus(); e.preventDefault(); }
      else if (k >= '1' && k <= '8'){ var t = TAGS[+k - 1]; if (t) basculeTag(t); }
    } else {
      if (k === 'ArrowLeft')       { deciderVideo('croix'); e.preventDefault(); }
      else if (k === 'ArrowRight') { deciderVideo('coeur'); e.preventDefault(); }
    }
  });

  $('bPoubelle').addEventListener('click', function(){ deciderClip('POUBELLE'); });
  $('bDebut').addEventListener('click', function(){ deciderClip('HOOK_DEBUT'); });
  $('bFin').addEventListener('click', function(){ deciderClip('HOOK_FIN'); });
  $('bGarder').addEventListener('click', function(){ deciderClip('GARDER'); });
  /* Les dix motifs de départ : ce qui a réellement dû être corrigé cette
     semaine. La liste se réordonne ensuite par fréquence — le plus fréquent
     en tête, parce que c'est celui qu'on va vouloir cocher le plus souvent. */
  var TAGS = ['synchro', 'son', 'hook', 'trop long', 'sous-titres',
              'cadrage', 'texte', 'musique', 'CTA', 'rythme'];
  var CLET = 'tri-tags-freq';
  var freq = {}; try { freq = JSON.parse(localStorage.getItem(CLET)) || {}; } catch(e){}
  var choisis = new Set();

  function dessinerTags(){
    var el = $('modTags');
    var tri = TAGS.slice().sort(function(a,b){
      var d = (freq[b]||0) - (freq[a]||0);
      return d !== 0 ? d : TAGS.indexOf(a) - TAGS.indexOf(b);
    });
    el.innerHTML = '';
    tri.forEach(function(t){
      var b = document.createElement('button');
      b.type = 'button';
      b.innerHTML = t + (freq[t] ? '<span class="n">' + freq[t] + '</span>' : '');
      if (choisis.has(t)) b.className = 'on';
      b.addEventListener('click', function(){
        if (choisis.has(t)) { choisis.delete(t); b.classList.remove('on'); }
        else { choisis.add(t); b.classList.add('on'); }
      });
      el.appendChild(b);
    });
  }

  function ouvrirModif(){
    if (j >= vue.length) return;
    choisis = new Set();
    $('modTitre').textContent = vue[j].titre;
    $('modNote').value = '';
    dessinerTags();
    $('voileMod').hidden = false;
  }
  function fermerModif(){ $('voileMod').hidden = true; }

  $('bStylo').addEventListener('click', ouvrirModif);
  $('modAnnuler').addEventListener('click', fermerModif);
  $('voileMod').addEventListener('click', function(e){ if (e.target === this) fermerModif(); });
  $('modOk').addEventListener('click', function(){
    var tags = [...choisis];
    var note = $('modNote').value.trim();
    if (!tags.length && !note){
      dire('<b>Dis au moins quoi corriger</b> — une étiquette ou un mot.', 'ko');
      return;
    }
    tags.forEach(function(t){ freq[t] = (freq[t] || 0) + 1; });
    try { localStorage.setItem(CLET, JSON.stringify(freq)); } catch(e){}
    fermerModif();
    deciderVideo('stylo', tags, note);
  });

  $('bCroix').addEventListener('click', function(){ deciderVideo('croix'); });
  $('bCoeur').addEventListener('click', function(){ deciderVideo('coeur'); });

  /* Glissé tactile. Seuil à 45 px pour ne pas déclencher sur un simple appui,
     et l'axe dominant décide — sinon un geste en diagonale range au hasard.
     Sur l'onglet vidéos, seul l'axe horizontal compte : il n'y a que deux
     réponses, et un geste vertical est presque toujours un début de scroll. */
  var x0 = null, y0 = null;
  var scene = document.querySelector('.scene');
  scene.addEventListener('touchstart', function(e){
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, { passive: true });
  scene.addEventListener('touchend', function(e){
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if (Math.abs(dx) < 45 && Math.abs(dy) < 45) return;
    if (mode === 'videos'){
      if (Math.abs(dx) > Math.abs(dy)) deciderVideo(dx < 0 ? 'croix' : 'coeur');
      return;
    }
    if (Math.abs(dx) > Math.abs(dy)) deciderClip(dx < 0 ? 'POUBELLE' : 'GARDER');
    else deciderClip(dy < 0 ? 'HOOK_DEBUT' : 'HOOK_FIN');
  }, { passive: true });

  /* ═══════════════ chargement ═══════════════ */
  fetch('/videos/liste.json?t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(demarrerVideos)
    .catch(function(){ if (mode === 'videos') dire('<b>liste des vidéos introuvable</b>', 'ko'); });

  fetch('/tri-clips/clips.json').then(function(r){
    if (!r.ok) throw new Error('absent');
    return r.json();
  }).then(demarrerClips).catch(function(){
