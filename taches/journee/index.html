<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Ma journée</title>
<style>
  :root{--noir:#07080b;--carte:#0f1218;--carte2:#141922;--ligne:#212734;--blanc:#eef1f6;--gris:#8b93a3;
        --or:#eab308;--surOr:#1a1200;--vert:#22c55e;--violet:#8b5cf6;--bleu:#60a5fa}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--noir);color:var(--blanc);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;padding:22px 16px 120px}
  .w{max-width:760px;margin:0 auto}
  a{color:var(--or)}
  .eb{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--gris)}
  h1{font-size:clamp(26px,6vw,38px);line-height:1.08;letter-spacing:-.02em;margin:10px 0 6px}
  .sous{color:var(--gris);font-size:14.5px;max-width:56ch}
  .jauge{display:flex;gap:6px;margin:20px 0 26px}
  .jauge i{flex:1;height:6px;border-radius:3px;background:#1a2030}
  .jauge i.on{background:var(--or)}
  .bloc{background:var(--carte);border:1px solid var(--ligne);border-radius:14px;padding:18px 16px;margin-bottom:16px}
  .bloc.actif{border-color:rgba(234,179,8,.45)}
  .bloc.fini{opacity:.55}
  .haut{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .bloc h2{font-size:19px;font-weight:650;letter-spacing:-.01em}
  .hr{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--gris);margin-left:auto}
  .but{color:#c3cad6;font-size:14px;margin-top:8px}
  ul{list-style:none;margin-top:14px;display:flex;flex-direction:column;gap:8px}
  li{display:flex;gap:11px;align-items:flex-start;background:#0a0d13;border:1px solid var(--ligne);border-radius:10px;padding:11px 12px}
  li.ok{opacity:.5}
  li.ok .tx{text-decoration:line-through}
  .case{width:26px;height:26px;border-radius:8px;border:2px solid #38425a;flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;background:none}
  li.ok .case{border-color:var(--vert);background:rgba(34,197,94,.16)}
  .case b{width:12px;height:6px;border-left:3px solid var(--vert);border-bottom:3px solid var(--vert);transform:rotate(-45deg) translateY(-2px);display:block;opacity:0}
  li.ok .case b{opacity:1}
  .tx{font-size:15px;line-height:1.45}
  .tx small{display:block;color:var(--gris);font-size:12.5px;margin-top:3px}
  .actes{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  button{font:inherit;font-size:15px;font-weight:600;border:1px solid var(--ligne);background:#161b23;color:var(--blanc);
         border-radius:10px;padding:12px 18px;cursor:pointer;min-height:46px}
  button.p{background:var(--or);border-color:var(--or);color:var(--surOr)}
  button:disabled{opacity:.45;cursor:default}
  .chrono{font-family:ui-monospace,Menlo,monospace;font-size:30px;font-weight:700;letter-spacing:-.02em}
  .chrono.run{color:var(--or)}
  .note{width:100%;font:inherit;font-size:15px;color:var(--blanc);background:#0a0d13;border:1px solid var(--ligne);
        border-radius:10px;padding:11px 12px;resize:vertical;min-height:70px;margin-top:12px}
  .note:focus{outline:0;border-color:var(--or)}
  .bilan{background:#0d1a10;border:1px solid #1f4d31;border-radius:10px;padding:12px 14px;margin-top:12px;font-size:14px;line-height:1.6;color:#a7e8bf}
  .bilan:empty{display:none}
  .pied{position:fixed;left:0;right:0;bottom:0;background:#0b0e13;border-top:1px solid var(--ligne);padding:11px 16px;text-align:center;font-size:13px;color:var(--gris)}
  .pied b{color:var(--blanc)}
  .vide{color:var(--gris);font-size:14px;padding:10px 2px}
</style>
</head>
<body>
<div class="w">
  <div class="eb">Ta journée · 3 sessions</div>
  <h1>Ce que tu fais<br>ce matin et cet après-midi</h1>
  <p class="sous">Trois blocs de deux heures et demie à trois heures. Un but par bloc, jamais plus.
     À la fin d'un bloc tu le clôtures : ce que tu as coché part dans mon carnet, et je te réponds au passage suivant.</p>
  <div class="jauge" id="jauge"><i></i><i></i><i></i></div>
  <div id="blocs"></div>
</div>
<div class="pied" id="pied">Chargement…</div>

<script>
(() => {
  const URL_ETAT = 'https://n7n.automatisationboost.com/webhook/taches-validation';
  const BLOCS = [
    { id:'matin',  nom:'Matin — décider et débloquer', h:'08:30 → 11:15', min:165,
      but:"Tout ce qui m'attend. Chaque case cochée ici me débloque une tâche derrière.", src:'toi' },
    { id:'aprem',  nom:'Après-midi — vendre', h:'13:30 → 16:15', min:165,
      but:"Un prospect nommé, un téléphone. Rien qui se fabrique, que des gens à qui parler.", src:'cash' },
    { id:'soir',   nom:'Fin de journée — produire', h:'17:00 → 19:30', min:150,
      but:"Tourner, enregistrer, valider ce que j'ai livré. C'est le carburant de demain.", src:'valider' },
  ];
  let etat = {}, taches = [], coche = {}, chrono = {};
  try { coche = JSON.parse(localStorage.getItem('journee-' + new Date().toISOString().slice(0,10)) || '{}'); } catch (_) {}
  try { chrono = JSON.parse(localStorage.getItem('journee-chrono') || '{}'); } catch (_) {}
  const sauver = () => { try {
    localStorage.setItem('journee-' + new Date().toISOString().slice(0,10), JSON.stringify(coche));
    localStorage.setItem('journee-chrono', JSON.stringify(chrono)); } catch (_) {} };
  const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c]));

  /* Les listes viennent du tableau de validation : mêmes tâches, même vérité.
     'toi' = ce qui me bloque · 'valider' = ce que j'ai livré et qui attend ton avis
     · 'cash' = les tâches dont le titre parle d'un prospect, d'un appel ou d'un envoi. */
  const MOTS_CASH = /(appel|rappel|prospect|relance|devis|client|lead|email|envoi|unisson|koytcha|papi|arena|vendre|rendez-vous|cal\.com)/i;
  const pour = (src) => {
    const e = (t) => (etat[t.id] && etat[t.id].etat) || t.etat;
    if (src === 'toi')     return taches.filter((t) => t.qui === 'toi' && e(t) !== 'ok');
    if (src === 'valider') return taches.filter((t) => e(t) === 'fait').slice(0, 6);
    return taches.filter((t) => t.qui === 'toi' && MOTS_CASH.test(t.titre + ' ' + (t.pourquoi||'')) && e(t) !== 'ok');
  };
  /* Au-delà d'une heure on lit « 2 h 44 » ; dans la dernière heure, les minutes et les secondes. */
  const mmss = (ms) => { const s = Math.max(0, Math.round(ms/1000)), h = Math.floor(s/3600);
    return h ? h + ' h ' + String(Math.floor((s%3600)/60)).padStart(2,'0')
             : String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); };
  const restant = (b) => { const c = chrono[b.id]; if (!c) return b.min*60000;
    return c.run ? Math.max(0, c.fin - Date.now()) : c.reste; };

  const rendre = () => {
    document.getElementById('blocs').innerHTML = BLOCS.map((b) => {
      const l = pour(b.src);
      const faites = l.filter((t) => coche[t.id]).length;
      const clos = !!coche['__clos_' + b.id];
      return `<div class="bloc ${clos ? 'fini' : ''}" id="b-${b.id}">
        <div class="haut"><h2>${esc(b.nom)}</h2><span class="hr">${b.h}</span></div>
        <p class="but">${esc(b.but)}</p>
        <ul>${l.length ? l.map((t) => `<li class="${coche[t.id] ? 'ok' : ''}" data-id="${esc(t.id)}">
            <button class="case" aria-label="Cocher"><b></b></button>
            <span class="tx">${esc(t.titre)}<small>${esc(t.fini || t.pourquoi || '')}</small></span></li>`).join('')
          : '<li class="vide">Rien dans ce bloc aujourd’hui. Prends une tâche du tableau de validation.</li>'}</ul>
        <div class="actes">
          <span class="chrono ${chrono[b.id] && chrono[b.id].run ? 'run' : ''}" id="c-${b.id}">${mmss(restant(b))}</span>
          <button data-go="${b.id}">${chrono[b.id] && chrono[b.id].run ? 'Pause' : 'Démarrer'}</button>
          <button class="p" data-clore="${b.id}" ${clos ? 'disabled' : ''}>${clos ? 'Bloc clôturé' : 'Clôturer le bloc'}</button>
        </div>
        <textarea class="note" id="n-${b.id}" placeholder="Ce qui a bloqué, ce que tu veux que je reprenne…">${esc(coche['__note_' + b.id] || '')}</textarea>
        <div class="bilan" id="bil-${b.id}">${clos ? `Clôturé : ${faites} tâche(s) sur ${l.length}.` : ''}</div>
      </div>`;
    }).join('');
    document.getElementById('jauge').innerHTML = BLOCS.map((b) => `<i class="${coche['__clos_'+b.id] ? 'on' : ''}"></i>`).join('');
    brancher();
  };

  const brancher = () => {
    document.querySelectorAll('li[data-id] .case').forEach((c) => c.onclick = () => {
      const id = c.closest('li').dataset.id; coche[id] = !coche[id]; sauver(); rendre(); });
    document.querySelectorAll('[data-go]').forEach((b) => b.onclick = () => {
      const bl = BLOCS.find((x) => x.id === b.dataset.go); const c = chrono[bl.id] || { reste: bl.min*60000, run:false };
      if (c.run) { c.reste = Math.max(0, c.fin - Date.now()); c.run = false; }
      else { c.fin = Date.now() + c.reste; c.run = true; }
      chrono[bl.id] = c; sauver(); rendre(); });
    document.querySelectorAll('[data-clore]').forEach((b) => b.onclick = () => clore(b.dataset.clore));
    document.querySelectorAll('.note').forEach((n) => n.onchange = () => {
      coche['__note_' + n.id.slice(2)] = n.value.trim(); sauver(); });
  };

  const clore = (id) => {
    const b = BLOCS.find((x) => x.id === id), l = pour(b.src);
    const faites = l.filter((t) => coche[t.id]);
    const note = (document.getElementById('n-' + id) || {}).value || '';
    coche['__clos_' + id] = true; sauver();
    etat['session:' + Date.now()] = { etat:'session', bloc:b.nom, jour:new Date().toISOString().slice(0,10),
      faites: faites.map((t) => t.id), total: l.length, note: note.trim(), maj: new Date().toISOString() };
    envoyer();
    rendre();
    document.getElementById('bil-' + id).innerHTML =
      `Bloc clôturé. <b>${faites.length}</b> tâche(s) sur ${l.length}` + (note.trim() ? ' · ta note est partie avec.' : '.') +
      ' Je te réponds au prochain passage avec ce qui reste et une amélioration à tester.';
  };

  let enVol = false, duNeuf = false;
  const envoyer = async () => {
    duNeuf = true; if (enVol) return; enVol = true;
    while (duNeuf) { duNeuf = false;
      try { await fetch(URL_ETAT, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(etat) });
        document.getElementById('pied').innerHTML = '<b>Enregistré.</b> Ton bilan est sur le serveur.'; }
      catch (e) { duNeuf = true; document.getElementById('pied').textContent = 'Envoi impossible — je réessaie.'; await new Promise(r => setTimeout(r, 1500)); } }
    enVol = false;
  };

  setInterval(() => { let bouge = false;
    BLOCS.forEach((b) => { const c = chrono[b.id]; if (!c || !c.run) return; bouge = true;
      const el = document.getElementById('c-' + b.id); if (el) el.textContent = mmss(Math.max(0, c.fin - Date.now()));
      if (c.fin - Date.now() <= 0) { c.run = false; c.reste = 0; sauver(); rendre(); } });
    if (bouge) document.title = 'Ma journée · en cours';
  }, 1000);

  (async () => {
    try {
      const [rt, re] = await Promise.all([ fetch('../valider/taches.json'), fetch(URL_ETAT + '?t=' + Date.now()) ]);
      taches = (await rt.json()).taches || [];
      const j = await re.json();
      const d = typeof j.donnees === 'string' ? JSON.parse(j.donnees || '{}') : (j.donnees || {});
      etat = d && typeof d === 'object' ? d : {};
      document.getElementById('pied').innerHTML = `<b>${taches.length}</b> tâches lues · dernière écriture ${j.maj ? new Date(j.maj).toLocaleString('fr-FR') : 'jamais'}`;
    } catch (e) { document.getElementById('pied').textContent = 'Liste non chargée — vérifie ta connexion.'; }
    rendre();
  })();
})();
</script>
</body>
</html>
