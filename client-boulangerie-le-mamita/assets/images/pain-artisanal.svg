<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFF8F0"/>
      <stop offset="100%" style="stop-color:#F5E6D3"/>
    </radialGradient>
    <radialGradient id="breadGrad" cx="40%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#D4864E"/>
      <stop offset="60%" style="stop-color:#C07040"/>
      <stop offset="100%" style="stop-color:#8B4513"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgGrad)"/>
  <!-- Assiette -->
  <ellipse cx="200" cy="248" rx="160" ry="22" fill="#E8D5C0" opacity="0.6"/>
  <!-- Pain de campagne -->
  <ellipse cx="200" cy="175" rx="130" ry="75" fill="url(#breadGrad)"/>
  <!-- Texture croûte -->
  <ellipse cx="200" cy="168" rx="118" ry="65" fill="none" stroke="#A0622A" stroke-width="2" stroke-dasharray="8,6" opacity="0.5"/>
  <!-- Incisions du pain -->
  <path d="M 130 160 Q 200 130 270 160" fill="none" stroke="#8B4513" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M 140 175 Q 200 148 260 175" fill="none" stroke="#8B4513" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 145 190 Q 200 165 255 190" fill="none" stroke="#8B4513" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- Reflet brillant -->
  <ellipse cx="165" cy="155" rx="35" ry="20" fill="#E8A870" opacity="0.3"/>
  <!-- Miettes -->
  <circle cx="100" cy="235" r="3" fill="#C07040" opacity="0.5"/>
  <circle cx="290" cy="238" r="2" fill="#C07040" opacity="0.4"/>
  <circle cx="310" cy="232" r="4" fill="#C07040" opacity="0.3"/>
  <!-- Farine -->
  <ellipse cx="200" cy="230" rx="80" ry="8" fill="#F5E6D3" opacity="0.8"/>
  <!-- Label -->
  <text x="200" y="282" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5A3A1A" letter-spacing="2">PAIN ARTISANAL</text>
</svg>
