<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <radialGradient id="bgGrad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFF8F0"/>
      <stop offset="100%" style="stop-color:#F5E6D3"/>
    </radialGradient>
    <linearGradient id="croissantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0C070"/>
      <stop offset="40%" style="stop-color:#D4A044"/>
      <stop offset="100%" style="stop-color:#A06820"/>
    </linearGradient>
    <linearGradient id="croissantDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C8903C"/>
      <stop offset="100%" style="stop-color:#8B5A14"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgGrad2)"/>
  <!-- Assiette -->
  <ellipse cx="200" cy="248" rx="150" ry="20" fill="#E8D5C0" opacity="0.5"/>
  <!-- Croissant - corps principal -->
  <path d="M 120 200 C 80 170, 90 110, 140 100 C 170 95, 190 115, 200 150 C 210 115, 230 95, 260 100 C 310 110, 320 170, 280 200 C 260 215, 240 210, 220 195 C 210 188, 205 182, 200 178 C 195 182, 190 188, 180 195 C 160 210, 140 215, 120 200 Z" fill="url(#croissantGrad)"/>
  <!-- Couches feuilletées gauche -->
  <path d="M 130 195 C 95 170, 100 120, 145 108" fill="none" stroke="url(#croissantDark)" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 142 200 C 108 178, 112 128, 155 115" fill="none" stroke="url(#croissantDark)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- Couches feuilletées droite -->
  <path d="M 270 195 C 305 170, 300 120, 255 108" fill="none" stroke="url(#croissantDark)" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 258 200 C 292 178, 288 128, 245 115" fill="none" stroke="url(#croissantDark)" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- Reflet brillant -->
  <path d="M 155 120 C 165 110, 200 108, 230 118" fill="none" stroke="#F5D080" stroke-width="5" stroke-linecap="round" opacity="0.4"/>
  <!-- Centre brillant -->
  <ellipse cx="200" cy="155" rx="15" ry="10" fill="#F0C070" opacity="0.4"/>
  <!-- Label -->
  <text x="200" y="278" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5A3A1A" letter-spacing="2">VIENNOISERIES</text>
