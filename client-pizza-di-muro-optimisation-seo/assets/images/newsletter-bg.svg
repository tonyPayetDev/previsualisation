<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="400" viewBox="0 0 1920 400">
  <defs>
    <linearGradient id="nlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e12c2c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a01a1a;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1920" height="400" fill="url(#nlGrad)"/>
  <rect width="1920" height="400" fill="url(#grid)"/>
  <!-- Envelope decorative -->
  <circle cx="1700" cy="200" r="200" fill="#ffffff" opacity="0.04"/>
  <circle cx="200" cy="200" r="150" fill="#ffffff" opacity="0.04"/>
</svg>
