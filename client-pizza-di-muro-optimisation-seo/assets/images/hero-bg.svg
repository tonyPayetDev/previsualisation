<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="600" viewBox="0 0 1920 600">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00171e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a2d36;stop-opacity:1" />
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#e12c2c" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="1920" height="600" fill="url(#heroGrad)"/>
  <rect width="1920" height="600" fill="url(#dots)"/>
  <!-- Pizza slice decorative -->
  <circle cx="1600" cy="300" r="280" fill="#e12c2c" opacity="0.08"/>
  <circle cx="1600" cy="300" r="200" fill="#e12c2c" opacity="0.06"/>
  <!-- Decorative elements -->
  <circle cx="200" cy="100" r="60" fill="#e12c2c" opacity="0.05"/>
  <circle cx="100" cy="500" r="100" fill="#e12c2c" opacity="0.04"/>
</svg>
