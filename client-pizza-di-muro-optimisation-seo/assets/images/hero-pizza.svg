<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500">
  <!-- Plate shadow -->
  <ellipse cx="300" cy="420" rx="200" ry="25" fill="#000000" opacity="0.2"/>
  <!-- Plate -->
  <circle cx="300" cy="280" r="220" fill="#f5f0e8" opacity="0.15"/>
  <circle cx="300" cy="280" r="200" fill="#e8e0d0" opacity="0.12"/>
  <!-- Pizza base -->
  <circle cx="300" cy="270" r="180" fill="#e8a020" opacity="0.85"/>
  <!-- Crust -->
  <circle cx="300" cy="270" r="180" fill="none" stroke="#c87018" stroke-width="20" opacity="0.7"/>
  <!-- Tomato sauce -->
  <circle cx="300" cy="270" r="155" fill="#e12c2c" opacity="0.7"/>
  <!-- Cheese -->
  <circle cx="300" cy="270" r="148" fill="#f5d555" opacity="0.6"/>
  <!-- Mozzarella blobs -->
  <circle cx="280" cy="250" r="30" fill="#fffde0" opacity="0.75"/>
  <circle cx="330" cy="265" r="25" fill="#fffde0" opacity="0.75"/>
  <circle cx="290" cy="300" r="28" fill="#fffde0" opacity="0.75"/>
  <circle cx="340" cy="240" r="20" fill="#fffde0" opacity="0.75"/>
  <circle cx="265" cy="290" r="22" fill="#fffde0" opacity="0.75"/>
  <circle cx="315" cy="310" r="18" fill="#fffde0" opacity="0.75"/>
  <!-- Toppings - pepperoni -->
  <circle cx="260" cy="240" r="16" fill="#c82020" opacity="0.85"/>
  <circle cx="340" cy="295" r="14" fill="#c82020" opacity="0.85"/>
  <circle cx="295" cy="225" r="15" fill="#c82020" opacity="0.85"/>
  <circle cx="345" cy="330" r="13" fill="#c82020" opacity="0.85"/>
  <circle cx="255" cy="320" r="14" fill="#c82020" opacity="0.85"/>
  <!-- Basil leaves -->
  <ellipse cx="310" cy="285" rx="18" ry="10" fill="#2d7a2d" opacity="0.8" transform="rotate(-30 310 285)"/>
  <ellipse cx="275" cy="265" rx="15" ry="8" fill="#2d7a2d" opacity="0.8" transform="rotate(20 275 265)"/>
  <ellipse cx="330" cy="250" rx="14" ry="8" fill="#2d7a2d" opacity="0.8" transform="rotate(-15 330 250)"/>
  <!-- Slice cut lines -->
  <line x1="300" y1="90" x2="300" y2="450" stroke="#c87018" stroke-width="1.5" opacity="0.4"/>
  <line x1="143" y1="183" x2="457" y2="357" stroke="#c87018" stroke-width="1.5" opacity="0.4"/>
  <line x1="457" y1="183" x2="143" y2="357" stroke="#c87018" stroke-width="1.5" opacity="0.4"/>
</svg>
