server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Ce site n'a rien à faire dans un moteur de recherche : c'est un espace de
    # prévisualisation, et les maquettes clientes y portent des noms réels. Sans
    # ça, un prospect à qui on envoie UNE démo peut retrouver toutes les autres
    # par une simple recherche.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location ~* \.(mp4|html)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        expires 0;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # CE QUI EST PROTÉGÉ : tout ce qu'un prospect ne doit jamais voir.
    #
    #   /            le sommaire — il liste TOUTES les maquettes clientes
    #   /taches/     le tableau de bord : chiffre d'affaires, blocages, coûts
    #   /appels/     la feuille d'appel : noms, numéros, ce qu'ils ont répondu
    #   /carte/      la carte des prospects
    #   /partage/    les liens de démonstration à envoyer
    #   /sites-clients/  l'inventaire (106 fiches, 73 numéros)
    #
    # CE QUI RESTE PUBLIC : les maquettes clientes elles-mêmes. C'est le but —
    # on envoie un lien direct, le client l'ouvre sans mot de passe, et il ne
    # voit que ça.
    #
    # ⚠️ Le modificateur ^~ est OBLIGATOIRE, il n'est pas décoratif.
    # Sans lui ces blocs sont de simples préfixes — et en nginx une location
    # par expression régulière l'emporte TOUJOURS sur un préfixe. Le bloc
    # `~* \.(mp4|html)$` ci-dessus captait donc /sites-clients/*.html et les
    # servait SANS authentification. Constaté le 2026-08-21 : 106 fiches
    # clients et 73 numéros de téléphone accessibles publiquement. Le défaut
    # était invisible tant que le script d'entrée supprimait le dossier faute
    # de mot de passe — tout répondait 404. Il est devenu réel à la seconde
    # où les variables ont été posées.
    # ─────────────────────────────────────────────────────────────────────────

    # Le sommaire. `location = /` ne matche QUE la racine exacte : les
    # maquettes en dessous ne sont pas concernées.
    location = / {
        auth_basic "Previsualisation — acces restreint";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files /index.html =404;
    }
    location = /index.html {
        auth_basic "Previsualisation — acces restreint";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }

    location ^~ /taches/ {
        auth_basic "Previsualisation — acces restreint";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ^~ /appels/ {
        auth_basic "Previsualisation — acces restreint";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ^~ /carte/ {
        auth_basic "Previsualisation — acces restreint";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ^~ /partage/ {
        auth_basic "Previsualisation — acces restreint";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ^~ /sites-clients/ {
        auth_basic "Inventaire — acces restreint";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Un robot qui ne lit pas l'en-tête lira peut-être ceci.
    location = /robots.txt {
        auth_basic off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Tout le reste — les maquettes clientes — est servi librement.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
