server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(mp4|html)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Inventaire des sites clients — contient des noms, des numéros et des
    # jugements internes. Protégé par mot de passe, jamais servi en clair.
    # Le fichier .htpasswd est généré au démarrage depuis les variables
    # d'environnement Coolify (voir docker-entrypoint.d/40-htpasswd.sh).
    # Le modificateur ^~ est OBLIGATOIRE ici, il n'est pas décoratif.
    #
    # Sans lui, ce bloc est un simple préfixe — et en nginx, une location par
    # expression régulière l'emporte TOUJOURS sur un préfixe. Le bloc
    # `~* \.(mp4|html)$` ci-dessus captait donc /sites-clients/*.html et les
    # servait SANS authentification. Constaté le 2026-08-21 : 106 fiches
    # clients et 73 numéros de téléphone accessibles publiquement.
    #
    # Le défaut était invisible tant que le script d'entrée supprimait le
    # dossier faute de mot de passe : tout répondait 404. Il est devenu réel
    # à la seconde où les variables ont été posées.
    #
    # ^~ arrête la recherche dès que le préfixe correspond : plus aucune regex
    # n'est évaluée, l'authentification s'applique à TOUT ce qui est dessous.
    location ^~ /sites-clients/ {
        auth_basic "Inventaire — acces restreint";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        # Repris du bloc regex, qui ne s'applique plus ici à cause de ^~.
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
