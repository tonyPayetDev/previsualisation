server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Ce site n'a rien à faire dans un moteur de recherche : c'est un espace de
    # prévisualisation, et les maquettes clientes y portent des noms réels. Sans
    # ça, un prospect à qui on envoie UNE démo peut retrouver toutes les autres
    # par une simple recherche.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location ~* \.(mp4|html)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        expires 0;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # CE QUI EST PROTÉGÉ : tout ce qu'un prospect ne doit jamais voir.
    #
    #   /            le sommaire — il liste TOUTES les maquettes clientes
    #   /taches/     le tableau de bord : chiffre d'affaires, blocages, coûts
    #   /appels/     la feuille d'appel : noms, numéros, ce qu'ils ont répondu
    #   /carte/      la carte des prospects
    #   /partage/    les liens de démonstration à envoyer
    #   /sites-clients/  l'inventaire (106 fiches, 73 numéros)
    #
    # CE QUI RESTE PUBLIC : les maquettes clientes elles-mêmes. C'est le but —
    # on envoie un lien direct, le client l'ouvre sans mot de passe, et il ne
    # voit que ça.
    #
    # ⚠️ Le modificateur ^~ est OBLIGATOIRE, il n'est pas décoratif.
    # Sans lui ces blocs sont de simples préfixes — et en nginx une location
    # par expression régulière l'emporte TOUJOURS sur un préfixe. Le bloc
    # `~* \.(mp4|html)$` ci-dessus captait donc /sites-clients/*.html et les
    # servait SANS authentification. Constaté le 2026-08-21 : 106 fiches
    # clients et 73 numéros de téléphone accessibles publiquement. Le défaut
    # était invisible tant que le script d'entrée supprimait le dossier faute
    # de mot de passe — tout répondait 404. Il est devenu réel à la seconde
    # où les variables ont été posées.
    # ─────────────────────────────────────────────────────────────────────────

    # Le sommaire. `location = /` ne matche QUE la racine exacte : les
    # maquettes en dessous ne sont pas concernées.
    location = / {
        auth_basic "Previsualisation — acces restreint";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files /index.html =404;
    }
    location = /index.html {
        auth_basic "Previsualisation — acces restreint";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }

    location ^~ /taches/ {
        auth_basic "Previsualisation — acces restreint";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ^~ /appels/ {
        auth_basic "Previsualisation — acces restreint";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ^~ /carte/ {
        auth_basic "Previsualisation — acces restreint";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ^~ /cta/ {
        auth_basic "Previsualisation — acces restreint";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ^~ /a-envoyer/ {
        auth_basic "Previsualisation — acces restreint";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ^~ /partage/ {
        auth_basic "Previsualisation — acces restreint";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ^~ /sites-clients/ {
        auth_basic "Inventaire — acces restreint";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Les listes de prospects. Même défaut que /sites-clients/ le 21/08, sur
    # d'autres routes : relevé le 2026-08-26, ces deux pages répondaient 200
    # sans mot de passe et portaient ensemble 634 numéros de téléphone de
    # commerçants réels — 58 sur leads-qualifies, 576 sur leads-restaurants.
    # Le ^~ est ici aussi obligatoire : sans lui la regex `\.(mp4|html)$`
    # l'emporte et sert les pages en clair.
    location ^~ /leads-qualifies/ {
        auth_basic "Prospects — acces restreint";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ^~ /leads-restaurants/ {
        auth_basic "Prospects — acces restreint";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    # La fiche de branchement : elle porte l'adresse et le téléphone d'un
    # commerçant réel, plus l'adresse personnelle de Tony. Même traitement que
    # les listes de prospects.
    # L'onboarding porte les OKR, les objectifs de revenus et le ratio de
    # santé du business. Même traitement que le reste des pages internes.
    location ^~ /onboarding/ {
        auth_basic "Cockpit — acces restreint";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    # La salle de sprint porte la liste des tâches en cours : même régime que
    # le reste du cockpit.
    location ^~ /sprint/ {
        auth_basic "Sprint — acces restreint";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    # L'étude des pubs concurrentes porte le positionnement en prix de Tony et
    # son message d'outreach : c'est de la stratégie, pas une démo client.
    location ^~ /etude-pubs/ {
        auth_basic "Etude — acces restreint";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    # La bibliothèque de prompts est un actif de production, pas une démo.
    location ^~ /prompts-seedance-21/ {
        auth_basic "Prompts — acces restreint";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Le studio de pose est un outil interne : il ouvre la caméra et sert à
    # constituer la banque d'avatars. Rien d'un livrable client.
    location ^~ /studio-avatar/ {
        auth_basic "Studio — acces restreint";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ^~ /banque/ {
        auth_basic "Banque — acces restreint";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ^~ /branchement-demo/ {
        auth_basic "Prospects — acces restreint";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    # L'étude de marché : elle porte le positionnement en prix et le plan de
    # Tony, pas seulement le relevé des concurrents. La version destinée au
    # public est la ressource du site (ressources/etude-42-concurrents-*.html),
    # d'où la stratégie a été retirée volontairement.
    location ^~ /etude-concurrents/ {
        auth_basic "Etude — acces restreint";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Les fichiers de construction, à la racine, ne sont pas du contenu.
    #
    # Ils étaient servis publiquement — vérifié le 2026-08-25, tous en 200.
    # descriptions.json porte le nom lisible des 161 routes décrites, dates.json
    # celui des 324 routes existantes : les lire donne exactement la liste que
    # le mot de passe sur « / » existe pour cacher. nginx.conf, lui, publiait
    # le plan du dispositif de protection.
    #
    # `location = ` est un match EXACT et prime sur tout le reste : on ne peut
    # pas filtrer par extension, les maquettes ont besoin de leurs propres
    # .json (tony-site-v2/content.json est chargé par la page).
    #
    # 404 plutôt que 403 : ne pas confirmer que le fichier existe.
    # ─────────────────────────────────────────────────────────────────────────
    location = /descriptions.json      { return 404; }
    location = /dates.json             { return 404; }
    location = /prod2.json             { return 404; }
    location = /new.json               { return 404; }
    location = /build-index.mjs        { return 404; }
    location = /Dockerfile             { return 404; }
    location = /nginx.conf             { return 404; }
    location = /index.manuel.html.bak  { return 404; }

    # Un robot qui ne lit pas l'en-tête lira peut-être ceci.
    location = /robots.txt {
        auth_basic off;
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Tout le reste — les maquettes clientes — est servi librement.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
