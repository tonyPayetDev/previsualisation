server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(mp4|html)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Inventaire des sites clients — contient des noms, des numéros et des
    # jugements internes. Protégé par mot de passe, jamais servi en clair.
    # Le fichier .htpasswd est généré au démarrage depuis les variables
    # d'environnement Coolify (voir docker-entrypoint.d/40-htpasswd.sh).
    location /sites-clients/ {
        auth_basic "Inventaire — acces restreint";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
