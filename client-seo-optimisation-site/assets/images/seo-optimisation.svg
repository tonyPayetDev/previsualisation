<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <rect width="320" height="220" rx="12" fill="#fff9e6"/>
  <!-- Gear icons -->
  <circle cx="120" cy="100" r="40" fill="none" stroke="#ffcc00" stroke-width="3" opacity="0.4"/>
  <circle cx="120" cy="100" r="24" fill="#ffcc00" opacity="0.25"/>
  <circle cx="120" cy="100" r="10" fill="#ffcc00"/>
  <!-- Gear teeth top -->
  <rect x="115" y="54" width="10" height="12" rx="2" fill="#ffcc00" opacity="0.7" transform="rotate(0 120 100)"/>
  <rect x="115" y="54" width="10" height="12" rx="2" fill="#ffcc00" opacity="0.7" transform="rotate(45 120 100)"/>
  <rect x="115" y="54" width="10" height="12" rx="2" fill="#ffcc00" opacity="0.7" transform="rotate(90 120 100)"/>
  <rect x="115" y="54" width="10" height="12" rx="2" fill="#ffcc00" opacity="0.7" transform="rotate(135 120 100)"/>
  <rect x="115" y="54" width="10" height="12" rx="2" fill="#ffcc00" opacity="0.7" transform="rotate(180 120 100)"/>
  <rect x="115" y="54" width="10" height="12" rx="2" fill="#ffcc00" opacity="0.7" transform="rotate(225 120 100)"/>
  <rect x="115" y="54" width="10" height="12" rx="2" fill="#ffcc00" opacity="0.7" transform="rotate(270 120 100)"/>
  <rect x="115" y="54" width="10" height="12" rx="2" fill="#ffcc00" opacity="0.7" transform="rotate(315 120 100)"/>
  <!-- Second gear -->
  <circle cx="200" cy="120" r="28" fill="none" stroke="#0057b8" stroke-width="2.5" opacity="0.4"/>
  <circle cx="200" cy="120" r="16" fill="#0057b8" opacity="0.2"/>
  <circle cx="200" cy="120" r="7" fill="#0057b8" opacity="0.7"/>
  <!-- Bars -->
  <rect x="50" y="165" width="220" height="28" rx="6" fill="white" stroke="#e9ecef" stroke-width="1"/>
  <rect x="58" y="172" width="55" height="14" rx="3" fill="#0057b8" opacity="0.7"/>
  <rect x="118" y="172" width="75" height="14" rx="3" fill="#ffcc00"/>
  <rect x="198" y="172" width="40" height="14" rx="3" fill="#0057b8" opacity="0.3"/>
  <text x="160" y="148" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#8a6d00" text-anchor="middle">Optimisation Technique</text>
</svg>
