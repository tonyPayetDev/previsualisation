<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <rect width="320" height="220" rx="12" fill="#f0fff4"/>
  <!-- Chart area -->
  <rect x="40" y="60" width="240" height="110" rx="8" fill="white" stroke="#e9ecef" stroke-width="1"/>
  <!-- Grid lines -->
  <line x1="40" y1="88" x2="280" y2="88" stroke="#f0f0f0" stroke-width="1"/>
  <line x1="40" y1="115" x2="280" y2="115" stroke="#f0f0f0" stroke-width="1"/>
  <line x1="40" y1="142" x2="280" y2="142" stroke="#f0f0f0" stroke-width="1"/>
  <!-- Trend line -->
  <polyline points="55,148 80,138 105,132 130,120 155,115 180,105 205,95 230,80 255,72 275,65"
    fill="none" stroke="#0057b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Area fill -->
  <polygon points="55,148 80,138 105,132 130,120 155,115 180,105 205,95 230,80 255,72 275,65 275,165 55,165"
    fill="url(#g1)" opacity="0.15"/>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0057b8"/>
      <stop offset="100%" stop-color="#0057b8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Dots -->
  <circle cx="275" cy="65" r="5" fill="#0057b8"/>
  <circle cx="275" cy="65" r="9" fill="#0057b8" opacity="0.2"/>
  <!-- Up arrow -->
  <circle cx="240" cy="50" r="14" fill="#e8f5e9"/>
  <polyline points="235,54 240,44 245,54" fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="240" y1="44" x2="240" y2="58" stroke="#2e7d32" stroke-width="2.5" stroke-linecap="round"/>
  <text x="258" y="52" font-family="Inter,sans-serif" font-size="10" font-weight="700" fill="#2e7d32">+34%</text>
  <!-- X-axis labels -->
  <text x="55" y="180" font-family="Inter,sans-serif" font-size="9" fill="#aaa" text-anchor="middle">Jan</text>
  <text x="105" y="180" font-family="Inter,sans-serif" font-size="9" fill="#aaa" text-anchor="middle">Mar</text>
  <text x="155" y="180" font-family="Inter,sans-serif" font-size="9" fill="#aaa" text-anchor="middle">Mai</text>
  <text x="205" y="180" font-family="Inter,sans-serif" font-size="9" fill="#aaa" text-anchor="middle">Juil</text>
  <text x="255" y="180" font-family="Inter,sans-serif" font-size="9" fill="#aaa" text-anchor="middle">Sep</text>
  <text x="160" y="32" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#1a5c2e" text-anchor="middle">Suivi &amp; Amélioration</text>
</svg>
