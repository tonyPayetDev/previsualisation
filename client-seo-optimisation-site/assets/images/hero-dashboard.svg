<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <!-- Background card -->
  <rect width="480" height="320" rx="16" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="480" height="52" rx="16" fill="rgba(255,255,255,0.12)"/>
  <rect x="16" y="18" width="12" height="12" rx="6" fill="#ff5f57"/>
  <rect x="34" y="18" width="12" height="12" rx="6" fill="#ffbd2e"/>
  <rect x="52" y="18" width="12" height="12" rx="6" fill="#28c840"/>
  <text x="90" y="28" font-family="Inter,sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">analytics.seopro.fr — Tableau de bord</text>

  <!-- Left panel: score circle -->
  <circle cx="100" cy="168" r="64" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="12"/>
  <circle cx="100" cy="168" r="64" fill="none" stroke="#ffcc00" stroke-width="12"
    stroke-dasharray="362" stroke-dashoffset="72" stroke-linecap="round" transform="rotate(-90 100 168)"/>
  <text x="100" y="160" font-family="Inter,sans-serif" font-weight="800" font-size="28" fill="white" text-anchor="middle">87</text>
  <text x="100" y="178" font-family="Inter,sans-serif" font-size="11" fill="rgba(255,255,255,0.6)" text-anchor="middle">Score SEO</text>
  <text x="100" y="248" font-family="Inter,sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle">+12 pts ce mois</text>

  <!-- Right panel: metrics bars -->
  <!-- Traffic -->
  <text x="200" y="84" font-family="Inter,sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">Trafic organique</text>
  <rect x="200" y="92" width="240" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
  <rect x="200" y="92" width="196" height="8" rx="4" fill="#ffcc00"/>
  <text x="448" y="100" font-family="Inter,sans-serif" font-size="10" fill="#ffcc00" text-anchor="end">+82%</text>

  <!-- Keywords -->
  <text x="200" y="122" font-family="Inter,sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">Mots-clés top 3</text>
  <rect x="200" y="130" width="240" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
  <rect x="200" y="130" width="168" height="8" rx="4" fill="#4fc3f7"/>
  <text x="448" y="138" font-family="Inter,sans-serif" font-size="10" fill="#4fc3f7" text-anchor="end">70%</text>

  <!-- Backlinks -->
  <text x="200" y="160" font-family="Inter,sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">Backlinks qualité</text>
  <rect x="200" y="168" width="240" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
  <rect x="200" y="168" width="211" height="8" rx="4" fill="#81c784"/>
  <text x="448" y="176" font-family="Inter,sans-serif" font-size="10" fill="#81c784" text-anchor="end">88%</text>

  <!-- Speed -->
  <text x="200" y="198" font-family="Inter,sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">Vitesse page</text>
  <rect x="200" y="206" width="240" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
  <rect x="200" y="206" width="221" height="8" rx="4" fill="#ce93d8"/>
  <text x="448" y="214" font-family="Inter,sans-serif" font-size="10" fill="#ce93d8" text-anchor="end">92%</text>

  <!-- Mini chart area -->
  <rect x="200" y="236" width="252" height="60" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <polyline points="210,280 228,262 246,270 264,248 282,255 300,240 318,252 336,238 354,242 372,230 390,235 408,222 426,218 444,208" fill="none" stroke="#ffcc00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="210,285 228,282 246,278 264,272 282,270 300,265 318,268 336,260 354,258 372,250 390,248 408,242 426,238 444,232" fill="none" stroke="rgba(79,195,247,0.6)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="210" y="252" font-family="Inter,sans-serif" font-size="9" fill="rgba(255,255,255,0.4)">Évolution 12 mois</text>
</svg>
