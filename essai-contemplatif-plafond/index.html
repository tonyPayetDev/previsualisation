<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prévisualisation — Le plafond de verre</title>
  <style>
    :root { --bg:#090a0e; --panel:#12141a; --border:#2a2d36; --text:#eceef2; --muted:#9da3af; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:1.5rem 1rem 3rem; background:radial-gradient(circle at 50% 10%,#1b202b 0,#090a0e 42%); color:var(--text); font-family:system-ui,sans-serif; }
    .wrap { max-width:480px; margin:0 auto; }
    .back { display:inline-block; margin-bottom:1rem; color:var(--muted); font-size:.8rem; text-decoration:none; }
    header { margin-bottom:1rem; }
    h1 { margin:0 0 .35rem; font:400 1.45rem/1.2 Georgia,"Times New Roman",serif; }
    header p { margin:0; color:var(--muted); font-size:.82rem; line-height:1.45; }
    .card { overflow:hidden; border:1px solid var(--border); border-radius:18px; background:var(--panel); box-shadow:0 24px 70px rgba(0,0,0,.35); }
    .stage { position:relative; overflow:hidden; aspect-ratio:9/16; background:#020306; }
     iframe, video { position:absolute; inset:0; display:block; width:100%; height:100%; border:0; background:#020306; }
     .rendered { object-fit:contain; }
    .play { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); border:1px solid rgba(236,238,242,.35); border-radius:999px; padding:.85rem 1.25rem; background:rgba(9,10,14,.84); color:var(--text); cursor:pointer; font:600 .9rem system-ui,sans-serif; backdrop-filter:blur(10px); }
    .play:hover { background:#eceef2; color:#090a0e; }
    .play[hidden] { display:none; }
    .meta { padding:1rem 1.15rem 1.2rem; color:var(--muted); font-size:.78rem; line-height:1.6; }
    footer { margin-top:1.25rem; color:#6f7580; text-align:center; font-size:.7rem; }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="back" href="/">← Toutes les vidéos</a>
    <header>
      <h1>Le plafond de verre</h1>
      <p>Essai contemplatif · musique douce, b-roll atmosphérique et avatar discret</p>
    </header>
    <section class="card">
      <div class="stage">
        <video class="rendered" src="essai-contemplatif-plafond-yellow-final.mp4" controls preload="metadata" playsinline title="Le plafond de verre — rendu MP4 jaune"></video>
        <iframe id="composition" src="composition.html" title="Le plafond de verre — composition interactive" allow="autoplay" hidden></iframe>
        <button class="play" id="play" type="button" hidden>Lire la composition interactive</button>
      </div>
       <div class="meta">Rendu MP4 final disponible ci-dessus. La composition interactive reste conservée dans le projet.</div>
    </section>
    <footer>previsualisation.automatisationboost.com</footer>
  </main>
  <script>
    const frame = document.querySelector('#composition');
    const play = document.querySelector('#play');
    let timers = [];
    play.addEventListener('click', async () => {
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      const timeline = win && win.__timelines && win.__timelines.main;
      if (!timeline) {
        play.textContent = 'Composition indisponible';
        return;
      }
      timers.forEach(clearTimeout);
      timers = [];
      timeline.restart();
      const audio = [...doc.querySelectorAll('audio')];
      const videos = [...doc.querySelectorAll('video')];
      const captions = [...doc.querySelectorAll('.cap')];
      // Unlock every track during the user gesture. The ambience is persistent;
      // only voice tracks are sequenced and paused between segments.
      await Promise.allSettled(audio.map(async (item) => {
        item.volume = Number(item.dataset.volume || 1);
        item.currentTime = 0;
        await item.play();
        item.pause();
        item.currentTime = 0;
      }));
      videos.forEach((item) => { item.muted = true; item.currentTime = 0; item.play().then(() => item.pause()).catch(() => {}); });
      const ambience = doc.querySelector('#a-amb');
      const voices = audio.filter((item) => item !== ambience);
      if (ambience) {
        ambience.loop = true;
        ambience.currentTime = 0;
        ambience.play().catch(() => {});
      }
      voices.forEach((item) => {
        const start = Number(item.dataset.start || 0) * 1000;
        const duration = (Number.isFinite(item.duration) ? item.duration : Number(item.dataset.duration || 0)) * 1000;
        timers.push(setTimeout(() => {
          voices.forEach((other) => { if (other !== item) other.pause(); });
          item.currentTime = 0;
          item.play().catch(() => {});
          const index = Number(item.id.replace('a-s', '')) - 1;
          const words = captions[index]?.querySelectorAll('.word') || [];
          words.forEach((word) => word.classList.remove('active'));
          const wordDuration = duration / Math.max(words.length, 1);
          words.forEach((word, wordIndex) => {
            timers.push(setTimeout(() => {
              words.forEach((other) => other.classList.remove('active'));
              word.classList.add('active');
            }, wordIndex * wordDuration));
          });
          timers.push(setTimeout(() => item.pause(), duration));
        }, start));
      });
      videos.forEach((item) => {
        const start = Number(item.dataset.start || 0) * 1000;
        const duration = Number(item.dataset.duration || 0) * 1000;
        timers.push(setTimeout(() => {
          item.currentTime = 0;
          item.play().catch(() => {});
          timers.push(setTimeout(() => item.pause(), duration));
        }, start));
      });
      play.hidden = true;
    });
  </script>
</body>
</html>
