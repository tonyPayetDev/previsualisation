<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Monteur → Tournage</title>
<meta name="robots" content="noindex,nofollow">
<!-- /monteur/ a fusionné dans /tournage/ (T-049, 2026-10-02).
     Le mélange coach de cadrage + choix du modèle de montage + commande de
     montage est désormais dans une seule page : /tournage/.
     Cette page ne fait que rediriger, pour ne pas casser les liens déjà
     partagés (outils/, commandes d'agents, anciens reperes.json). -->
<meta http-equiv="refresh" content="0;url=/tournage/">
<link rel="canonical" href="/tournage/">
<style>
:root{--nuit:#0c0d18;--carte:#141626;--trait:#252943;--encre:#eef0f7;--doux:#9298b3;--jaune:#eab308}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--nuit)}
body{background:var(--nuit);color:var(--encre);min-height:100vh;display:flex;align-items:center;
  justify-content:center;padding:24px 18px;
  font:400 16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-align:center}
.carte{max-width:520px;background:var(--carte);border:1px solid var(--trait);
  border-left:4px solid var(--jaune);border-radius:16px;padding:26px 24px}
h1{font-size:clamp(20px,6vw,26px);font-weight:800;letter-spacing:-.03em;margin-bottom:8px}
p{color:var(--doux);font-size:15px;line-height:1.6}
a{display:inline-block;margin-top:18px;padding:13px 22px;border-radius:12px;
  background:var(--jaune);color:#0c0d18;font-weight:800;text-decoration:none}
</style>
</head>
<body>
  <main class="carte">
    <h1>Le monteur a déménagé</h1>
    <p>Caméra, coach de cadrage, modèle de montage et commande de montage sont
      maintenant réunis dans <b>/tournage/</b>.</p>
    <a href="/tournage/">Ouvrir /tournage/</a>
    <script>location.replace('/tournage/');</script>
  </main>
</body>
</html>
